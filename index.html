  def('verify_repair', {
    purpose: 'Ask someone other than the person who did the work.',
    input: '{ ticketId }', output: '{ method, verifier, windowMinutes }',
    permission: 'request_verification', failures: ['reporter silent'], audit: true,
    run: ({ ticketId }) => {
      const t = S.ticket(ticketId);
      const rec = T.detect_recurring_failure.run({ assetId: t.assetId });
      const pol = verificationPolicy({ priority: t.priority, hazard: t.hazard, recurring: rec.ok && rec.data.recurring, reopenCount: t.reopenCount });
      t.verification.attempts += 1;
      t.verification.policy = pol;
      const askSecondResident = t.verification.attempts > 1;
      const target = pol.verifier === 'WARDEN' ? 'WARDEN' : askSecondResident ? 'SECOND_RESIDENT' : 'REPORTER';
      if (target === 'WARDEN') {
        T.notify_role.run({ ticketId, role: 'WARDEN', event: 'verification_required', title: 'Hazard sign-off needed', body: 'A hazard ticket cannot be closed on a resident confirmation. Please inspect and sign off.' });
      } else if (target === 'SECOND_RESIDENT') {
        const a = S.asset(t.assetId);
        const other = db.users.find((u) => u.role === 'RESIDENT' && u.id !== t.reporterId && (S.block((db.rooms.find((r) => r.id === u.roomId) || {}).blockId) || {}).id === a.blockId);
        if (other) S.notify({ to: other.id, role: 'RESIDENT', event: 'verification_required', title: `Is ${a.tag} working again?`, body: `${a.location}. One tap: working / still broken.`, ticketId, requiresAction: true });
      } else {
        T.notify_student.run({ ticketId, event: 'verification_required', title: 'Is it working now?', body: 'The technician says it is repaired. One tap: working / still broken.', requiresAction: true });
      }
      S.ticketEvent(ticketId, 'VERIFICATION_REQUESTED', `Verification requested from ${target} (attempt ${t.verification.attempts}).`);
      return { ok: true, data: { ...pol, target, attempt: t.verification.attempts }, rationale: pol.rationale };
    },
  });

  def('close_ticket', {
    purpose: 'Close only after independent confirmation, and write the learning record.',
    input: '{ ticketId, confirmedBy, outcome }', output: 'ticket',
    permission: 'close_ticket', failures: ['hazard ticket without human sign-off'], audit: true,
    run: ({ ticketId, confirmedBy, outcome = 'VERIFIED', confirmerRole = 'RESIDENT' }) => {
      const t = S.ticket(ticketId);
      if (t.hazard && confirmerRole !== 'WARDEN' && confirmerRole !== 'ADMIN') {
        return { ok: false, error: 'HAZARD_NEEDS_HUMAN', rationale: 'A hazard ticket can only be closed by a warden or the estate manager. The agent is forbidden from closing it.' };
      }
      const a = S.asset(t.assetId);
      const wo = db.workOrders.find((w) => w.ticketId === ticketId);
      const downtimeMinutes = Math.round((now() - t.downtimeStartedAt) / 60000);
      t.state = 'CLOSED'; t.closedAt = now(); t.updatedAt = now();
      t.verification.confirmedBy = confirmedBy; t.outcome = outcome;
      t.downtimeMinutes = downtimeMinutes;
      a.status = 'OPERATIONAL';
      a.reliability = Math.max(20, Math.min(100, Math.round(a.reliability - 6 + (t.reopenCount ? -8 : 2))));
      db.machineHistory.push({
        id: S.id('mh'), assetId: a.id, at: now(), kind: 'FAILURE',
        summary: (wo && wo.repairNotes) || t.text, partIds: (wo && wo.partsUsed.map((p) => p.partId)) || [],
        technicianId: wo && wo.technicianId, downtimeMinutes, costPaise: (wo && wo.costPaise) || 0, ticketId,
      });
      S.ticketEvent(ticketId, 'CLOSED', `Closed after ${outcome.toLowerCase()} confirmation. Downtime ${downtimeMinutes} min.`);
      S.audit({ actor: 'agent', actorRole: 'AGENT', action: 'close_ticket', entity: 'ticket', entityId: ticketId, after: { outcome, downtimeMinutes, confirmedBy }, rationale: `Closed on ${outcome} by ${confirmedBy}.` });
      return { ok: true, data: t, rationale: `Closed. Downtime ${downtimeMinutes} minutes. Asset reliability now ${a.reliability}.` };
    },
  });

  def('reopen_ticket', {
    purpose: 'Reopen on dispute or a repeat failure inside the window, and do not send the same technician back by default.',
    input: '{ ticketId, reason }', output: 'ticket',
    permission: 'reopen_ticket', failures: [], audit: true,
    run: ({ ticketId, reason }) => {
      const t = S.ticket(ticketId);
      const order = ['P3', 'P2', 'P1', 'P0'];
      const raised = order[Math.min(order.indexOf(t.priority) + 1, 2)]; 
      t.reopenCount += 1; t.state = 'REOPENED'; t.priority = raised;
      t.sla = slaPolicy(raised, db.slaRules); t.updatedAt = now();
      const wo = db.workOrders.find((w) => w.ticketId === ticketId);
      const previousTech = wo && wo.technicianId;
      if (wo) { wo.status = 'REOPENED'; wo.excludeTechnicianId = previousTech; }
      S.asset(t.assetId).status = 'FAILED';
      S.ticketEvent(ticketId, 'REOPENED', `Reopened: ${reason}. Priority raised to ${raised}.`);
      S.audit({ actor: 'agent', actorRole: 'AGENT', action: 'reopen_ticket', entity: 'ticket', entityId: ticketId, after: { priority: raised, reopenCount: t.reopenCount }, rationale: `Reopened because: ${reason}. Priority raised one band; the previous technician is excluded from reassignment so the same diagnosis is not repeated.` });
      return { ok: true, data: t, rationale: `Reopened at ${raised}. ${previousTech ? 'Previous technician excluded from reassignment.' : ''}` };
    },
  });

  

  def('schedule_preventive_maintenance', {
    purpose: 'Turn a detected pattern into a scheduled intervention before the next failure.',
    input: '{ assetId, reasons[], recommendation }', output: 'prediction',
    permission: 'schedule_preventive', failures: [], audit: true,
    run: ({ assetId, reasons = [], recommendation = 'PREVENTIVE_SCHEDULE' }) => {
      const a = S.asset(assetId);
      const h = T.get_machine_history.run({ assetId }).data;
      const predictedWindowDays = h.mtbfDays ? Math.max(7, Math.round(h.mtbfDays * 0.7)) : 30;
      const part = (S.machineType(a.typeKey).commonParts || [])[0];
      const p = {
        id: S.id('PRD'), assetId, createdAt: now(), reasons, recommendation,
        predictedNextFailureWindowDays: predictedWindowDays,
        proposedActionAt: now() + predictedWindowDays * 0.6 * DAY,
        proposedWork: recommendation === 'REPLACE'
          ? `Replace ${a.tag}. Lifetime repair spend ${_rupees(h.totalCostPaise)} against a unit cost that is now comparable.`
          : `Inspect ${a.tag}, test the element and thermostat, pre-stage ${part ? S.part(part).name : 'the common wear part'}.`,
        partToPreStage: part, status: 'PROPOSED', basis: 'DEMO DATA — derived from the seeded maintenance history in this demo.',
      };
      db.maintenancePredictions.push(p);
      a.status = a.status === 'OPERATIONAL' ? 'AT_RISK' : a.status;
      S.audit({ actor: 'agent', actorRole: 'AGENT', action: 'schedule_preventive_maintenance', entity: 'maintenance_prediction', entityId: p.id, after: { recommendation, predictedWindowDays }, rationale: reasons.join('; ') });
      T.notify_role.run({ ticketId: null, role: 'WARDEN', event: 'preventive_proposed', title: `Preventive work proposed for ${a.tag}`, body: p.proposedWork });
      return { ok: true, data: p, rationale: `Proposed ${recommendation} for ${a.tag}; next failure expected inside ~${predictedWindowDays} days on current MTBF.` };
    },
  });

  

  def('log_voice_turn', {
    purpose: 'Record every voice turn: transcript, detected intent, action, outcome.',
    input: '{ sessionId, speaker, transcript, intent, action, outcome }', output: 'voiceSession',
    permission: 'notify', failures: [], audit: true,
    run: ({ sessionId, speaker, transcript, intent, action, outcome, language = 'en-IN', mode = 'DEMO', provider = 'Typed' }) => {
      let s = db.voiceSessions.find((v) => v.id === sessionId);
      if (!s) { s = { id: sessionId || S.id('VS'), startedAt: now(), language, mode, provider, turns: [] }; db.voiceSessions.push(s); }
      const turn = { at: now(), speaker, transcript, intent, action, outcome };
      s.turns.push(turn);
      S.audit({ actor: speaker, actorRole: speaker === 'agent' ? 'AGENT' : 'RESIDENT', action: 'voice_turn', entity: 'voice_session', entityId: s.id, after: { intent, action, outcome }, rationale: 'Voice interaction logged for audit.' });
      return { ok: true, data: s, rationale: `Voice turn logged (${speaker}).` };
    },
  });

  

  
  async function callTool(name, args = {}, ctx = {}) {
    const tool = T[name];
    const actorRole = ctx.actorRole || 'AGENT';
    if (!tool) {
      return { ok: false, error: 'NO_SUCH_TOOL', rationale: `"${name}" is not a registered tool. The agent cannot invent capabilities.` };
    }
    const auth = authorizationPolicy(actorRole, tool.permission);
    if (!auth.allowed) {
      S.audit({ actor: ctx.actor || 'agent', actorRole, action: name, entity: 'tool', entityId: name, rationale: auth.rationale, outcome: 'DENIED' });
      return { ok: false, error: 'FORBIDDEN', rationale: auth.rationale };
    }
    const startedAt = now();
    let result;
    try {
      result = await tool.run(args);
    } catch (err) {
      result = { ok: false, error: 'TOOL_EXCEPTION', rationale: `Tool failed internally: ${String(err && err.message).slice(0, 120)}` };
    }
    const action = {
      id: S.id('ACT'), runId: ctx.runId || null, ticketId: ctx.ticketId || null,
      at: startedAt, durationMs: 0, tool: name, args: S.redact(args),
      ok: result.ok, error: result.error || null, rationale: result.rationale,
      data: S.redact(result.data), actorRole,
    };
    db.agentActions.push(action);
    S.emit('agentAction', action);
    return result;
  }

  return { tools: T, callTool, catalogue: () => Object.values(T).map(({ name, purpose, input, output, permission, failures, audit }) => ({ name, purpose, input, output, permission, failures, audit })) };
}









const PLAN_TEMPLATE = [
  { key: 'identify', label: 'Identify the machine' },
  { key: 'history', label: 'Retrieve maintenance history' },
  { key: 'classify', label: 'Screen for hazards and classify' },
  { key: 'prioritise', label: 'Score priority and set the SLA' },
  { key: 'ticket', label: 'Open the work order' },
  { key: 'dispatch', label: 'Select and dispatch a technician' },
  { key: 'ack', label: 'Get acknowledgement' },
  { key: 'diagnose', label: 'Diagnose on site' },
  { key: 'parts', label: 'Source parts if needed' },
  { key: 'repair', label: 'Complete the repair' },
  { key: 'verify', label: 'Verify independently' },
  { key: 'close', label: 'Close and record' },
  { key: 'learn', label: 'Update machine memory' },
];

function createAgent({ store, toolkit }) {
  const S = store;
  const db = S.db;
  const { callTool } = toolkit;
  const now = () => S.clock.now();

  function newRun(ticketId, goalText) {
    const run = {
      id: S.id('RUN'), ticketId, goal: goalText,
      plan: PLAN_TEMPLATE.map((p) => ({ ...p, status: 'PENDING', at: null, note: null })),
      state: 'REPORTED', previousState: null, waitingFor: null, nextAction: null,
      nextActionDueAt: null, requiresHuman: false, humanReason: null, risk: 'LOW',
      timers: [], escalationAttempts: 0, createdAt: now(), updatedAt: now(),
      blocked: false, blockedReason: null, finished: false,
      memory: { assetId: null, priority: null, technicianId: null, partId: null, hazard: false, recurring: false },
    };
    db.agentRuns.push(run);
    S.emit('run', run);
    return run;
  }

  const step = (run, key, status, note) => {
    const s = run.plan.find((p) => p.key === key);
    if (s) { s.status = status; s.at = now(); if (note) s.note = note; }
  };

  function armTimer(run, key, minutes, onTimeout, payload = {}) {
    run.timers = run.timers.filter((t) => t.key !== key || t.fired);
    const t = { id: S.id('TMR'), key, armedAt: now(), dueAt: now() + minutes * 60000, minutes, onTimeout, payload, fired: false };
    run.timers.push(t);
    return t;
  }

  function clearTimer(run, key) {
    run.timers.forEach((t) => { if (t.key === key && !t.fired) t.cancelled = true; });
    run.timers = run.timers.filter((t) => !t.cancelled);
  }

  function setState(run, next, reason) {
    const t = S.ticket(run.ticketId);
    run.previousState = run.state;
    run.state = next;
    run.updatedAt = now();
    
    
    if (t && t.state !== 'CLOSED') { t.state = next; t.updatedAt = now(); }
    else if (t) { t.updatedAt = now(); }
    if (t) S.ticketEvent(run.ticketId, 'STATE', `${run.previousState} → ${next}`, { reason });
    S.audit({ actor: 'agent', actorRole: 'AGENT', action: 'transition', entity: 'agent_run', entityId: run.id, before: { state: run.previousState }, after: { state: next }, rationale: reason });
    S.emit('run', run);
  }

  function block(run, waitingFor, nextAction, dueAt, requiresHuman = false, humanReason = null) {
    run.blocked = true; run.waitingFor = waitingFor; run.nextAction = nextAction;
    run.nextActionDueAt = dueAt || null; run.requiresHuman = requiresHuman; run.humanReason = humanReason;
    run.updatedAt = now(); S.emit('run', run);
  }

  function unblock(run) { run.blocked = false; run.waitingFor = null; run.requiresHuman = false; run.humanReason = null; }

  
  
  

  
  async function intake({ text, reporterId, hazardAnswer = null, source = 'TEXT', context = {}, sessionId = null }) {
    const ctx = { actorRole: 'AGENT', actor: 'agent' };

    if (sessionId) await callTool('log_voice_turn', { sessionId, speaker: 'resident', transcript: text, intent: 'REPORT_FAILURE', action: 'intake', outcome: 'received' }, ctx);

    const parsed = await callTool('parse_report', { text, context }, ctx);
    if (!parsed.ok) return { kind: 'ERROR', message: 'I did not catch that. What has stopped working?' };

    const slots = { ...parsed.data.slots, ...context };
    const ident = await callTool('identify_asset', { slots, text }, ctx);

    if (!ident.ok && ident.error === 'AMBIGUOUS') {
      return { kind: 'QUESTION', question: ident.data.question, slot: ident.data.slot, slots, candidates: ident.data.candidates, rationale: ident.rationale };
    }
    if (!ident.ok && (ident.error === 'NO_ASSET_RECORD' || ident.error === 'OUT_OF_SCOPE')) {
      const dept = ident.data && ident.data.department;
      
      const ticket = await callTool('create_ticket', {
        assetId: null, reporterId, text, priority: 'P2', category: 'UNREGISTERED_ASSET',
        safety: { hazard: false, signals: [] }, functionLost: 'FULL', source, allowNoAsset: true,
      }, ctx);
      await callTool('notify_role', { ticketId: ticket.data.id, role: 'WARDEN', event: 'escalation', title: dept ? `Route to ${dept}` : 'Unregistered machine reported', body: `Resident report: "${text}". ${ident.rationale}` }, ctx);
      return {
        kind: 'UNREGISTERED', department: dept || null, rationale: ident.rationale,
        message: dept
          ? `That is handled by ${dept}, not the shared-machine register. I have logged it and passed it to the warden to route — you will not have to report it twice.`
          : 'I could not find this machine in the register. I have logged the report and asked the warden to register the asset — you will not have to repeat this.',
        ticket: ticket.data,
      };
    }

    const assetId = ident.data.assetId;

    
    if (hazardAnswer === null) {
      return { kind: 'HAZARD_QUESTION', question: HAZARD_QUESTION, assetId, slots, rationale: 'Safety screen is mandatory before dispatch and cannot be skipped or paraphrased by a model.' };
    }

    
    const dup = await callTool('check_duplicate', { assetId }, ctx);
    if (dup.data.duplicate) {
      const t = S.ticket(dup.data.ticketId);
      t.corroborations.push({ reporterId, at: now(), text });
      S.ticketEvent(t.id, 'CORROBORATED', `A second resident reported the same failure. ${t.corroborations.length + 1} independent reports.`);
      const run = S.runForTicket(t.id);
      
      const p = await callTool('calculate_priority', { assetId, safety: { forcedPriority: t.hazard ? 'P0' : null, signals: t.hazardSignals, rationale: '' }, functionLost: t.functionLost, duplicateReports: t.corroborations.length + 1 }, ctx);
      if (p.ok && p.data.priority !== t.priority) {
        const oldP = t.priority;
        t.priority = p.data.priority; t.priorityFactors = p.data.factors;
        S.ticketEvent(t.id, 'PRIORITY_RAISED', `Priority ${oldP} → ${p.data.priority} on independent corroboration.`);
      }
      return { kind: 'DUPLICATE', ticket: t, run, rationale: dup.data.rationale };
    }

    const cls = await callTool('classify_issue', { text, hazardAnswer, assetId }, ctx);
    const safety = cls.data.safety;
    const pri = await callTool('calculate_priority', { assetId, safety, functionLost: cls.data.functionLost }, ctx);

    const ticket = await callTool('create_ticket', {
      assetId, reporterId, text, priority: pri.data.priority, category: cls.data.category,
      safety, functionLost: cls.data.functionLost, priorityFactors: pri.data.factors, source,
    }, ctx);

    const a = S.asset(assetId);
    const run = newRun(ticket.data.id, `Restore ${a.tag} — ${a.location}`);
    run.memory.assetId = assetId; run.memory.priority = pri.data.priority; run.memory.hazard = safety.hazard;
    step(run, 'identify', 'DONE', `${a.tag} — ${ident.data.method}, confidence ${ident.data.confidence}`);
    step(run, 'classify', 'DONE', cls.data.category);
    step(run, 'prioritise', 'DONE', `${pri.data.priority} (score ${pri.data.score})`);
    step(run, 'ticket', 'DONE', ticket.data.id);

    await callTool('notify_student', {
      ticketId: ticket.data.id, event: 'ticket_created',
      title: `Logged as ${ticket.data.id} — ${a.tag}`,
      body: safety.hazard
        ? 'This is being treated as a safety issue. Do not use or touch the machine. A warden has been paged now.'
        : `${a.location}. Priority ${pri.data.priority}. I am assigning a technician — you do not need to follow up.`,
    }, ctx);

    if (sessionId) await callTool('log_voice_turn', { sessionId, speaker: 'agent', transcript: `Logged as ${ticket.data.id}. Assigning a technician now.`, intent: 'CONFIRM_TICKET', action: 'create_ticket', outcome: ticket.data.id }, ctx);

    setState(run, safety.hazard ? 'ESCALATED' : 'TICKET_CREATED', safety.hazard ? safety.rationale : 'Ticket created, moving to dispatch.');

    if (safety.hazard) {
      run.risk = 'CRITICAL';
      await callTool('notify_role', { ticketId: ticket.data.id, role: 'WARDEN', event: 'escalation', title: `SAFETY: ${a.tag} at ${a.location}`, body: `Hazard signals: ${safety.signals.join(', ')}. Reported by a resident just now. The agent has stopped and will not dispatch or spend on this ticket without you.` }, ctx);
      await callTool('escalate_ticket', { ticketId: ticket.data.id, breachType: 'SAFETY_HAZARD', attempts: 2 }, ctx);
      step(run, 'dispatch', 'BLOCKED', 'Held — safety escalation');
      block(run, 'HUMAN_DECISION', 'Warden must attend and authorise isolation before any technician is dispatched.', now() + 15 * 60000, true, `Hazard signals: ${safety.signals.join(', ')}`);
      return { kind: 'HAZARD', ticket: ticket.data, run, safety, rationale: safety.rationale };
    }

    return { kind: 'RUN_STARTED', ticket: ticket.data, run, rationale: pri.data.rationale };
  }

  
  
  

  
  async function tick(runId) {
    const run = S.run(runId);
    if (!run || run.finished) return false;
    const ctx = { actorRole: 'AGENT', actor: 'agent', runId: run.id, ticketId: run.ticketId };
    const t = S.ticket(run.ticketId);
    const a = t && S.asset(t.assetId);
    const wo = db.workOrders.find((w) => w.ticketId === run.ticketId);

    
    const due = run.timers.filter((tm) => !tm.fired && tm.dueAt <= now());
    if (due.length) {
      for (const tm of due) {
        tm.fired = true; tm.firedAt = now();
        await onTimeout(run, tm, ctx);
      }
      return true;
    }

    if (run.blocked) return false;

    switch (run.state) {
      case 'TICKET_CREATED': {
        const woRes = await callTool('create_work_order', { ticketId: run.ticketId }, ctx);
        step(run, 'history', 'RUNNING');
        const hist = await callTool('get_machine_history', { assetId: t.assetId }, ctx);
        const rec = await callTool('detect_recurring_failure', { assetId: t.assetId }, ctx);
        run.memory.recurring = rec.data.recurring;
        step(run, 'history', 'DONE', rec.data.recurring
          ? `${hist.data.failuresInWindow} failures in 90 days, MTBF ${hist.data.mtbfDays}d — recurrence flagged`
          : `${hist.data.failuresInWindow} failures in 90 days`);
        if (rec.data.recurring) {
          run.risk = 'ELEVATED';
          S.ticketEvent(run.ticketId, 'RECURRENCE_FLAGGED', `This machine has failed ${hist.data.failuresInWindow} times in 90 days. Treating as a pattern, not an incident.`);
        }
        setState(run, 'ASSIGNING', 'Work order created; selecting a technician.');
        armTimer(run, 'assign', 3, 'ASSIGN_TIMEOUT');
        return true;
      }

      case 'ASSIGNING': {
        step(run, 'dispatch', 'RUNNING');
        const type = S.machineType(a.typeKey);
        const find = await callTool('find_nearest_technician', { assetId: t.assetId, requiredSkill: a.typeKey }, ctx);
        if (!find.ok) {
          
          clearTimer(run, 'assign');
          await callTool('escalate_ticket', { ticketId: run.ticketId, breachType: 'NO_TECHNICIAN', attempts: 2 }, ctx);
          await callTool('notify_role', { ticketId: run.ticketId, role: 'WARDEN', event: 'escalation', title: `No technician available for ${a.tag}`, body: `${find.rationale} Options: authorise an external vendor call-out, or accept the next in-shift slot. The case file is attached.` }, ctx);
          await callTool('notify_student', { ticketId: run.ticketId, event: 'technician_delayed', title: 'No technician is free right now', body: 'I have escalated to the warden rather than leaving this in a queue. You will get an update as soon as it is decided — you do not need to chase.' }, ctx);
          step(run, 'dispatch', 'BLOCKED', 'No eligible technician');
          setState(run, 'ESCALATED', find.rationale);
          block(run, 'HUMAN_DECISION', 'Warden to authorise an external vendor or accept the next slot.', null, true, 'No technician passes the skill and shift filter.');
          return true;
        }
        const excluded = wo && wo.excludeTechnicianId;
        const pick = find.data.candidates.find((c) => c.technicianId !== excluded) || find.data.candidates[0];
        const avail = await callTool('check_technician_availability', { technicianId: pick.technicianId }, ctx);
        if (!avail.ok) {
          const next = find.data.candidates.find((c) => c.technicianId !== pick.technicianId);
          if (!next) { setState(run, 'ESCALATED', 'Top candidate became unavailable and there is no alternate.'); block(run, 'HUMAN_DECISION', 'Warden to resolve staffing.', null, true, 'All candidates unavailable.'); return true; }
        }
        const chosen = avail.ok ? pick : find.data.candidates.find((c) => c.technicianId !== pick.technicianId);
        const why = `Chosen over ${find.data.candidates.length - 1} other candidate(s): ${chosen.breakdown.map((b) => `${b.k} ${b.v} (${b.detail})`).join(', ')}. Total score ${chosen.score}.`;
        await callTool('assign_technician', { workOrderId: wo.id, technicianId: chosen.technicianId, etaMinutes: chosen.etaMinutes, rationale: why }, ctx);
        run.memory.technicianId = chosen.technicianId;
        await callTool('notify_technician', { ticketId: run.ticketId, technicianId: chosen.technicianId, event: 'technician_assigned', title: `${t.priority} — ${a.tag}, ${a.location}`, body: `${chosen.distanceKm} km, ETA ${chosen.etaMinutes} min. ${run.memory.recurring ? 'Repeat failure — prior history attached.' : ''}`, channel: 'PUSH' }, ctx);
        await callTool('notify_student', { ticketId: run.ticketId, event: 'technician_assigned', title: `${S.technician(chosen.technicianId).name} is on the way`, body: `ETA about ${chosen.etaMinutes} minutes. I am watching the clock; if there is no acknowledgement in ${t.sla.ackMinutes} minutes I escalate automatically.` }, ctx);
        step(run, 'dispatch', 'DONE', `${chosen.name} — ${chosen.distanceKm} km, ETA ${chosen.etaMinutes} min`);
        step(run, 'ack', 'RUNNING');
        clearTimer(run, 'assign');
        setState(run, 'ASSIGNED', why);
        armTimer(run, 'ack', t.sla.ackMinutes, 'ACK_TIMEOUT');
        block(run, 'TECHNICIAN_ACK', `Escalate if ${S.technician(chosen.technicianId).name} has not acknowledged within ${t.sla.ackMinutes} minutes.`, now() + t.sla.ackMinutes * 60000);
        return true;
      }

      case 'TECHNICIAN_ACKNOWLEDGED': {
        step(run, 'ack', 'DONE', `Accepted by ${S.technician(run.memory.technicianId).name}`);
        step(run, 'diagnose', 'RUNNING');
        armTimer(run, 'onsite', t.sla.onsiteMinutes, 'ONSITE_TIMEOUT');
        setState(run, 'DIAGNOSING', 'Technician travelling; history pushed to their device.');
        block(run, 'DIAGNOSIS', 'Waiting for the technician to record a diagnosis on site.', now() + t.sla.onsiteMinutes * 60000);
        return true;
      }

      case 'WAITING_FOR_PART': {
        const req = await callTool('request_part', { workOrderId: wo.id, partId: run.memory.partId, quantity: 1 }, ctx);
        if (req.data.reserved) {
          step(run, 'parts', 'DONE', 'Reserved from the campus store');
          clearTimer(run, 'part');
          setState(run, 'REPAIR_IN_PROGRESS', 'Part reserved on campus; repair can proceed.');
          armTimer(run, 'resolve', t.sla.resolveMinutes, 'RESOLVE_TIMEOUT');
          block(run, 'REPAIR_DONE', 'Waiting for the technician to complete the repair.', now() + t.sla.resolveMinutes * 60000);
          return true;
        }
        
        const amount = req.data.amountPaise;
        const vendor = req.data.vendor;
        if (!vendor) {
          setState(run, 'ESCALATED', 'No empanelled vendor stocks this part.');
          await callTool('notify_role', { ticketId: run.ticketId, role: 'WARDEN', event: 'escalation', title: `No supplier for ${S.part(run.memory.partId).name}`, body: 'The agent will not buy from a payee outside the allow-list. A human must choose a supplier.' }, ctx);
          block(run, 'HUMAN_DECISION', 'Warden to nominate a supplier.', null, true, 'No empanelled vendor for this part.');
          return true;
        }
        const decision = spendingPolicy({ amountPaise: amount, ticketSpentPaise: t.spentPaise, policy: db.spendPolicy, vendorEmpanelled: vendor.empanelled, hazardTicket: t.hazard });
        if (decision.decision === 'AUTONOMOUS') {
          const pay = await callTool('initiate_payment', { ticketId: run.ticketId, workOrderId: wo.id, amountPaise: amount, vendorId: vendor.id, partId: run.memory.partId }, ctx);
          if (pay.ok) {
            await callTool('verify_payment', { paymentId: pay.data.payment.id }, ctx);
            wo.costPaise += amount;
            step(run, 'parts', 'DONE', `${S.part(run.memory.partId).name} purchased — ₹${amount / 100}, inside the agent envelope`);
            clearTimer(run, 'part');
            setState(run, 'REPAIR_IN_PROGRESS', pay.rationale);
            armTimer(run, 'resolve', t.sla.resolveMinutes, 'RESOLVE_TIMEOUT');
            block(run, 'REPAIR_DONE', 'Part paid for and routed to site. Waiting for the repair to complete.', now() + t.sla.resolveMinutes * 60000);
            return true;
          }
          
          decision.decision = 'HUMAN_APPROVAL'; decision.approver = 'WARDEN';
          decision.reasons = [pay.rationale];
        }
        const ap = await callTool('request_approval', {
          ticketId: run.ticketId, kind: 'SPARE_PART_PURCHASE', amountPaise: amount,
          approver: decision.approver || 'WARDEN', reasons: decision.reasons,
          payload: { partId: run.memory.partId, partName: S.part(run.memory.partId).name, vendorId: vendor.id, vendorName: vendor.name, workOrderId: wo.id },
        }, ctx);
        step(run, 'parts', 'BLOCKED', `₹${amount / 100} needs ${decision.approver || 'WARDEN'} approval`);
        await callTool('notify_student', { ticketId: run.ticketId, event: 'approval_required', title: 'Waiting on an approval', body: 'The repair needs a part that has to be bought. The warden has been asked to approve it. Nothing is stuck with you.' }, ctx);
        setState(run, 'WAITING_FOR_APPROVAL', decision.rationale);
        armTimer(run, 'approval', 60, 'APPROVAL_TIMEOUT');
        block(run, 'HUMAN_APPROVAL', `${decision.approver || 'WARDEN'} to approve ₹${amount / 100} for ${S.part(run.memory.partId).name}. Escalates in 60 minutes.`, now() + 60 * 60000, true, decision.reasons.join(' '));
        return true;
      }

      case 'REPAIR_CLAIMED_COMPLETE': {
        step(run, 'repair', 'DONE', wo.repairNotes);
        step(run, 'verify', 'RUNNING');
        const v = await callTool('verify_repair', { ticketId: run.ticketId }, ctx);
        clearTimer(run, 'resolve');
        setState(run, 'VERIFICATION_PENDING', 'Technician claim recorded. The agent does not close on a claim.');
        armTimer(run, 'verify', v.data.windowMinutes, 'VERIFY_TIMEOUT');
        block(run, v.data.target === 'WARDEN' ? 'HUMAN_DECISION' : 'RESIDENT_VERIFICATION',
          v.data.target === 'WARDEN' ? 'Warden sign-off required on a hazard ticket.' : `Ask again, then a second resident, if there is no answer in ${v.data.windowMinutes} minutes.`,
          now() + v.data.windowMinutes * 60000, v.data.target === 'WARDEN', v.data.target === 'WARDEN' ? 'Hazard ticket needs physical sign-off.' : null);
        return true;
      }

      case 'VERIFIED': {
        const close = await callTool('close_ticket', { ticketId: run.ticketId, confirmedBy: t.verification.confirmedBy || 'resident', outcome: 'VERIFIED', confirmerRole: t.verification.confirmerRole || 'RESIDENT' }, ctx);
        if (!close.ok) {
          setState(run, 'ESCALATED', close.rationale);
          block(run, 'HUMAN_DECISION', 'Warden must sign off before closure.', null, true, close.rationale);
          return true;
        }
        step(run, 'verify', 'DONE', `Confirmed by ${t.verification.confirmedBy}`);
        step(run, 'close', 'DONE', `Downtime ${t.downtimeMinutes} min`);
        step(run, 'learn', 'RUNNING');
        const rec = await callTool('detect_recurring_failure', { assetId: t.assetId }, ctx);
        if (rec.data.recurring) {
          const p = await callTool('schedule_preventive_maintenance', { assetId: t.assetId, reasons: rec.data.reasons, recommendation: rec.data.recommendation }, ctx);
          step(run, 'learn', 'DONE', p.rationale);
          setState(run, 'RECURRING_FAILURE', rec.rationale);
          run.risk = 'ELEVATED';
          block(run, 'HUMAN_DECISION', 'Warden to decide: preventive schedule or replacement.', null, true, rec.data.reasons.join('; '));
          run.finished = false;
          return true;
        }
        step(run, 'learn', 'DONE', 'Machine memory updated.');
        setState(run, 'CLOSED', 'Verified and closed.');
        run.finished = true; unblock(run);
        return true;
      }

      case 'REOPENED': {
        step(run, 'verify', 'FAILED', 'Resident disputed the repair');
        ['repair', 'diagnose', 'ack'].forEach((k) => step(run, k, 'PENDING'));
        setState(run, 'ASSIGNING', 'Reopened. Reassigning, excluding the previous technician.');
        armTimer(run, 'assign', 3, 'ASSIGN_TIMEOUT');
        return true;
      }

      case 'DELAYED': {
        const esc = await callTool('escalate_ticket', { ticketId: run.ticketId, breachType: run.memory.lastBreach || 'SLA', attempts: run.escalationAttempts }, ctx);
        run.escalationAttempts += 1;
        run.risk = run.escalationAttempts >= 2 ? 'HIGH' : 'ELEVATED';
        const stepInfo = esc.data.step;
        if (stepInfo.target === 'TECHNICIAN') {
          await callTool('notify_technician', { ticketId: run.ticketId, technicianId: run.memory.technicianId, event: 'escalation', title: `Still waiting on ${a.tag}`, body: 'Acknowledge now or this is reassigned.', channel: 'CALL' }, ctx);
          await callTool('notify_student', { ticketId: run.ticketId, event: 'technician_delayed', title: 'Still chasing this', body: 'The technician has not acknowledged. I have called them. If there is no response I will reassign automatically — you do not need to do anything.' }, ctx);
          setState(run, 'ASSIGNED', stepInfo.rationale);
          armTimer(run, 'ack', Math.max(3, Math.round(t.sla.ackMinutes / 2)), 'ACK_TIMEOUT');
          block(run, 'TECHNICIAN_ACK', `Reassign if there is still no acknowledgement in ${Math.max(3, Math.round(t.sla.ackMinutes / 2))} minutes.`, now() + Math.max(3, Math.round(t.sla.ackMinutes / 2)) * 60000);
          return true;
        }
        if (stepInfo.target === 'NEXT_TECHNICIAN') {
          const tech = S.technician(run.memory.technicianId);
          if (tech) { tech.openJobs = Math.max(0, tech.openJobs - 1); tech.status = 'UNRESPONSIVE'; }
          if (wo) wo.excludeTechnicianId = run.memory.technicianId;
          await callTool('notify_student', { ticketId: run.ticketId, event: 'technician_delayed', title: 'Reassigning to someone else', body: 'The first technician did not respond. I am assigning a different one now.' }, ctx);
          setState(run, 'ASSIGNING', 'Reassigning to the next-best technician.');
          armTimer(run, 'assign', 3, 'ASSIGN_TIMEOUT');
          return true;
        }
        await callTool('notify_role', { ticketId: run.ticketId, role: stepInfo.target === 'ADMIN' ? 'ADMIN' : 'WARDEN', event: 'escalation', title: `${t.priority} ${a.tag} — agent is stuck`, body: `${esc.rationale} Full run history is attached.` }, ctx);
        setState(run, 'ESCALATED', stepInfo.rationale);
        block(run, 'HUMAN_DECISION', `${stepInfo.target} to take over.`, null, true, esc.rationale);
        return true;
      }

      default:
        if (TERMINAL.includes(run.state)) { run.finished = true; return false; }
        return false;
    }
  }

  
  async function onTimeout(run, timer, ctx) {
    const t = S.ticket(run.ticketId);
    run.memory.lastBreach = timer.onTimeout;
    switch (timer.onTimeout) {
      case 'ACK_TIMEOUT':
      case 'ONSITE_TIMEOUT':
      case 'RESOLVE_TIMEOUT':
      case 'PART_TIMEOUT':
        S.ticketEvent(run.ticketId, 'SLA_BREACH', `${timer.key} SLA breached after ${timer.minutes} minutes with no response.`);
        unblock(run);
        setState(run, 'DELAYED', `${timer.key} SLA breached after ${timer.minutes} minutes. Nobody asked me to check — the timer did.`);
        break;
      case 'APPROVAL_TIMEOUT':
        unblock(run);
        await callTool('escalate_ticket', { ticketId: run.ticketId, breachType: 'APPROVAL_TIMEOUT', attempts: 3 }, ctx);
        setState(run, 'ESCALATED', 'Approver did not respond within 60 minutes; escalated one level.');
        block(run, 'HUMAN_DECISION', 'Estate manager to decide the spend.', null, true, 'Warden did not respond to the approval request.');
        break;
      case 'VERIFY_TIMEOUT': {
        const v = await callTool('verify_repair', { ticketId: run.ticketId }, ctx);
        if (t.verification.attempts >= 3) {
          
          unblock(run);
          t.verification.confirmedBy = 'provisional (no response after 3 attempts)';
          t.verification.confirmerRole = 'SYSTEM';
          S.ticketEvent(run.ticketId, 'PROVISIONAL_CLOSE', 'No verification after three attempts. Provisionally closed with a 48-hour watch; any new report on this asset reopens it at a raised priority.');
          setState(run, 'VERIFIED', 'Provisional closure after three unanswered verification attempts, with a 48-hour watch armed.');
        } else {
          armTimer(run, 'verify', v.data.windowMinutes, 'VERIFY_TIMEOUT');
          S.ticketEvent(run.ticketId, 'VERIFICATION_RETRY', `Verification attempt ${t.verification.attempts}: asked ${v.data.target}.`);
        }
        break;
      }
      case 'ASSIGN_TIMEOUT':
        if (run.state === 'ASSIGNING') break; 
        unblock(run);
        setState(run, 'ESCALATED', 'Could not dispatch within the triage window.');
        block(run, 'HUMAN_DECISION', 'Warden to dispatch manually.', null, true, 'Dispatch timed out.');
        break;
      default:
        break;
    }
    S.emit('run', run);
  }

  
  async function runUntilBlocked(runId, maxSteps = 25) {
    let steps = 0;
    while (steps < maxSteps) {
      const moved = await tick(runId);
      if (!moved) break;
      steps += 1;
    }
    return S.run(runId);
  }

  
  async function advanceMinutes(minutes) {
    S.clock.advance(minutes);
    for (const run of db.agentRuns.filter((r) => !r.finished)) {
      await runUntilBlocked(run.id, 12);
    }
    return now();
  }

  
  
  

  
  const EVENT_PRECONDITIONS = {
    TECHNICIAN_ACK: ['ASSIGNED'],
    TECHNICIAN_ONSITE: ['ASSIGNED', 'TECHNICIAN_ACKNOWLEDGED', 'DIAGNOSING', 'DELAYED'],
    DIAGNOSIS: ['TECHNICIAN_ACKNOWLEDGED', 'DIAGNOSING', 'DELAYED', 'REOPENED'],
    REPAIR_DONE: ['REPAIR_IN_PROGRESS', 'WAITING_FOR_PART', 'DIAGNOSING'],
    RESIDENT_CONFIRM: ['REPAIR_CLAIMED_COMPLETE', 'VERIFICATION_PENDING'],
    RESIDENT_DISPUTE: ['REPAIR_CLAIMED_COMPLETE', 'VERIFICATION_PENDING', 'VERIFIED', 'CLOSED'],
    APPROVAL_DECISION: ['WAITING_FOR_APPROVAL'],
    HAZARD_CLEARED: ['ESCALATED'],
    WARDEN_DECISION: null, 
  };

  async function humanEvent(runId, event, payload = {}) {
    const run = S.run(runId);
    if (!run) return { ok: false, error: 'NO_RUN' };
    const allowedStates = EVENT_PRECONDITIONS[event];
    if (allowedStates && !allowedStates.includes(run.state)) {
      S.audit({
        actor: payload.actor || 'human', actorRole: payload.actorRole || 'UNKNOWN',
        action: 'rejected_out_of_sequence_event', entity: 'agent_run', entityId: runId,
        after: { event, state: run.state },
        rationale: `${event} is not valid while the run is ${run.state}.`,
      });
      return {
        ok: false, error: 'OUT_OF_SEQUENCE',
        rationale: `This run is at ${run.state}. ${event} cannot be applied here, so nothing was changed.`,
      };
    }
    
    
    
    
    const hctx = { actorRole: payload.actorRole || 'RESIDENT', actor: payload.actor || 'human', runId, ticketId: run.ticketId };
    const ctx = { actorRole: 'AGENT', actor: 'agent', runId, ticketId: run.ticketId };
    const t = S.ticket(run.ticketId);
    const wo = db.workOrders.find((w) => w.ticketId === run.ticketId);

    switch (event) {
      case 'TECHNICIAN_ACK': {
        clearTimer(run, 'ack');
        wo.acknowledgedAt = now();
        const asg = db.assignments.find((x) => x.workOrderId === wo.id && x.status === 'PENDING_ACK');
        if (asg) asg.status = 'ACCEPTED';
        S.ticketEvent(run.ticketId, 'TECHNICIAN_ACCEPTED', `${S.technician(wo.technicianId).name} accepted.`);
        S.audit({ actor: wo.technicianId, actorRole: 'TECHNICIAN', action: 'acknowledge_job', entity: 'work_order', entityId: wo.id, rationale: 'Technician accepted the job.' });
        unblock(run);
        setState(run, 'TECHNICIAN_ACKNOWLEDGED', 'Technician acknowledged inside SLA.');
        break;
      }
      case 'TECHNICIAN_ONSITE': {
        clearTimer(run, 'onsite');
        wo.arrivedAt = now();
        S.ticketEvent(run.ticketId, 'ONSITE', 'Technician arrived on site.');
        unblock(run);
        break;
      }
      case 'DIAGNOSIS': {
        clearTimer(run, 'onsite'); clearTimer(run, 'diagnose');
        wo.diagnosis = payload.diagnosis;
        if (!wo.arrivedAt) wo.arrivedAt = now();
        S.ticketEvent(run.ticketId, 'DIAGNOSIS', payload.diagnosis);
        S.audit({ actor: wo.technicianId, actorRole: 'TECHNICIAN', action: 'record_diagnosis', entity: 'work_order', entityId: wo.id, after: { diagnosis: payload.diagnosis }, rationale: 'Diagnosis recorded on site.' });
        step(run, 'diagnose', 'DONE', payload.diagnosis);
        unblock(run);
        if (payload.uncertain) {
          
          setState(run, 'ESCALATED', 'Technician is not confident in the diagnosis. A guessed repair on a repeat-failure asset is worse than a delay.');
          await callTool('notify_role', { ticketId: run.ticketId, role: 'WARDEN', event: 'escalation', title: `Uncertain diagnosis on ${S.asset(t.assetId).tag}`, body: `${payload.diagnosis} — second opinion requested before any spend.` }, ctx);
          block(run, 'HUMAN_DECISION', 'Warden to authorise a second opinion or an external specialist.', null, true, 'Diagnosis uncertain.');
          break;
        }
        if (payload.partId) {
          run.memory.partId = payload.partId;
          step(run, 'parts', 'RUNNING');
          const inv = await callTool('check_inventory', { partId: payload.partId }, ctx);
          S.ticketEvent(run.ticketId, 'PART_REQUIRED', inv.rationale);
          setState(run, 'WAITING_FOR_PART', inv.rationale);
          armTimer(run, 'part', 240, 'PART_TIMEOUT');
        } else {
          step(run, 'repair', 'RUNNING');
          setState(run, 'REPAIR_IN_PROGRESS', 'No part needed; repair proceeding.');
          armTimer(run, 'resolve', t.sla.resolveMinutes, 'RESOLVE_TIMEOUT');
          block(run, 'REPAIR_DONE', 'Waiting for the technician to complete the repair.', now() + t.sla.resolveMinutes * 60000);
        }
        break;
      }
      case 'REPAIR_DONE': {
        const rec = await callTool('record_repair', {
          workOrderId: wo.id, diagnosis: wo.diagnosis, repairNotes: payload.repairNotes,
          partsUsed: payload.partsUsed || (run.memory.partId ? [{ partId: run.memory.partId, quantity: 1 }] : []),
          costPaise: payload.costPaise || 0,
        }, { ...hctx, actorRole: 'TECHNICIAN' });
        if (!rec.ok) return { ok: false, error: rec.error, rationale: rec.rationale };
        unblock(run);
        setState(run, 'REPAIR_CLAIMED_COMPLETE', 'Technician claims the repair is complete.');
        break;
      }
      case 'RESIDENT_CONFIRM': {
        clearTimer(run, 'verify');
        t.verification.confirmedBy = payload.by || 'resident';
        t.verification.confirmerRole = payload.actorRole || 'RESIDENT';
        S.ticketEvent(run.ticketId, 'VERIFIED', `Confirmed working by ${t.verification.confirmedBy}.`);
        S.audit({ actor: payload.by, actorRole: payload.actorRole || 'RESIDENT', action: 'verify_repair', entity: 'ticket', entityId: t.id, after: { outcome: 'WORKING' }, rationale: 'Independent confirmation received.' });
        unblock(run);
        setState(run, 'VERIFIED', 'Independent confirmation received.');
        break;
      }
      case 'RESIDENT_DISPUTE': {
        clearTimer(run, 'verify');
        await callTool('reopen_ticket', { ticketId: run.ticketId, reason: payload.reason || 'Resident says it is still not working' }, ctx);
        const tech = S.technician(wo.technicianId);
        if (tech) tech.openJobs = Math.max(0, tech.openJobs - 1);
        unblock(run);
        setState(run, 'REOPENED', `Resident disputed the repair: ${payload.reason || 'still not working'}.`);
        await callTool('notify_role', { ticketId: run.ticketId, role: 'WARDEN', event: 'ticket_reopened', title: `${S.asset(t.assetId).tag} failed verification`, body: `The technician reported it fixed; the resident says otherwise. Priority raised to ${t.priority} and the same technician is excluded from reassignment.`, requiresAction: false }, ctx);
        break;
      }
      case 'APPROVAL_DECISION': {
        clearTimer(run, 'approval');
        const ap = db.approvals.find((x) => x.id === payload.approvalId);
        if (!ap) return { ok: false, error: 'NO_APPROVAL' };
        ap.status = payload.approved ? 'APPROVED' : 'REJECTED';
        ap.decidedAt = now(); ap.decidedBy = payload.by || 'warden'; ap.note = payload.note || null;
        S.audit({ actor: payload.by, actorRole: payload.actorRole || 'WARDEN', action: payload.approved ? 'approve_spend' : 'reject_spend', entity: 'approval', entityId: ap.id, after: { status: ap.status }, rationale: payload.note || 'Human decision on a spend outside the agent envelope.' });
        unblock(run);
        if (!payload.approved) {
          S.ticketEvent(run.ticketId, 'APPROVAL_REJECTED', `Rejected by ${ap.decidedBy}. ${ap.note || ''}`);
          setState(run, 'ESCALATED', 'Spend rejected. The agent will not proceed and hands back the alternatives.');
          block(run, 'HUMAN_DECISION', 'Warden to choose: substitute part, external vendor, or take the machine out of service.', null, true, 'Purchase rejected.');
          break;
        }
        const vendor = db.vendors.find((v) => v.id === ap.payload.vendorId);
        const pay = await callTool('initiate_payment', { ticketId: run.ticketId, workOrderId: wo.id, amountPaise: ap.amountPaise, vendorId: vendor.id, partId: ap.payload.partId, approvalId: ap.id }, ctx);
        if (pay.ok) {
          await callTool('verify_payment', { paymentId: pay.data.payment.id }, ctx);
          wo.costPaise += ap.amountPaise;
          step(run, 'parts', 'DONE', `Approved by ${ap.decidedBy} — ₹${ap.amountPaise / 100} paid`);
          clearTimer(run, 'part');
          setState(run, 'REPAIR_IN_PROGRESS', `Approved by ${ap.decidedBy}; payment captured and the part is routed to site.`);
          armTimer(run, 'resolve', t.sla.resolveMinutes, 'RESOLVE_TIMEOUT');
          block(run, 'REPAIR_DONE', 'Waiting for the repair to complete.', now() + t.sla.resolveMinutes * 60000);
        } else {
          
          setState(run, 'ESCALATED', pay.rationale);
          block(run, 'HUMAN_DECISION', 'Payment failed after approval. Warden to settle manually or raise the mandate.', null, true, pay.rationale);
        }
        break;
      }
      case 'HAZARD_CLEARED': {
        S.ticketEvent(run.ticketId, 'HAZARD_CLEARED', `Warden confirmed the hazard is isolated: ${payload.note || ''}`);
        S.audit({ actor: payload.by, actorRole: 'WARDEN', action: 'resolve_escalation', entity: 'ticket', entityId: t.id, after: { hazardCleared: true }, rationale: payload.note || 'Warden isolated the hazard and authorised a certified electrician.' });
        t.hazardCleared = true;
        unblock(run);
        setState(run, 'TICKET_CREATED', 'Warden isolated the hazard and authorised dispatch to a certified electrician only.');
        break;
      }
      case 'WARDEN_DECISION': {
        S.ticketEvent(run.ticketId, 'HUMAN_DECISION', payload.note || 'Warden decided.');
        unblock(run);
        if (payload.next) setState(run, payload.next, payload.note || 'Warden directed the next step.');
        break;
      }
      default:
        return { ok: false, error: 'UNKNOWN_EVENT' };
    }
    S.emit('run', run);
    await runUntilBlocked(runId, 15);
    return { ok: true, run: S.run(runId) };
  }

  return { intake, tick, runUntilBlocked, advanceMinutes, humanEvent, newRun, MACHINE };
}









function createSystem(opts = {}) {

));

const IST = { timeZone: 'Asia/Kolkata' };
const hhmm = (ms) => new Date(ms).toLocaleTimeString('en-IN', { ...IST, hour: '2-digit', minute: '2-digit', hour12: false });
const dmy = (ms) => new Date(ms).toLocaleDateString('en-IN', { ...IST, day: '2-digit', month: 'short', year: '2-digit' });
const dt = (ms) => `${dmy(ms)} ${hhmm(ms)}`;

const rupees = (paise) => '₹' + (paise / 100).toLocaleString('en-IN', { maximumFractionDigits: 2 });

function ago(ms, now) {
  const d = Math.max(0, now - ms), m = Math.round(d / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60);
  if (h < 24) return `${h} hr ago`;
  return `${Math.round(h / 24)} d ago`;
}

function until(ms, now) {
  if (!ms) return '—';
  const d = ms - now, m = Math.round(Math.abs(d) / 60000);
  const s = m < 60 ? `${m} min` : `${Math.round(m / 60)} hr`;
  return d >= 0 ? `in ${s}` : `${s} overdue`;
}

const titleCase = (s) => String(s || '').replace(/_/g, ' ').toLowerCase().replace(/(^|\s)\w/g, (c) => c.toUpperCase());


function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));


function bind(root, map) {
  root.addEventListener('click', (e) => {
    const node = e.target.closest('[data-act]');
    if (!node || !root.contains(node)) return;
    const fn = map[node.dataset.act];
    if (fn) { e.preventDefault(); fn(node, e); }
  });
  root.addEventListener('change', (e) => {
    const node = e.target.closest('[data-change]');
    if (!node) return;
    const fn = map[node.dataset.change];
    if (fn) fn(node, e);
  });
}

      <div class="modal__bd">${body}</div>
      <div class="modal__ft">
        <button class="btn btn--quiet" data-x="cancel">Cancel</button>
        <button class="btn ${danger ? 'btn--danger' : 'btn--primary'}" data-x="ok">${esc(confirm)}</button>
      </div>
    </div>
  </div>`);
  const close = () => { scrim.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  scrim.addEventListener('click', (e) => {
    if (e.target === scrim || e.target.dataset.x === 'cancel') close();
    if (e.target.dataset.x === 'ok') { const v = onConfirm(scrim); if (v !== false) close(); }
  });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(scrim);
  const first = scrim.querySelector('input, textarea, select, button[data-x="ok"]');
  if (first) first.focus();
  return { close, scrim };
}


function barChart(series, { alt = () => false } = {}) {
  const max = Math.max(1, ...series.map((s) => s.value));
  return `<div class="chart" role="img" aria-label="${esc(series.map((s) => `${s.label}: ${s.value}`).join(', '))}">
      ${series.map((s) => `<div><b>${esc(s.display ?? s.value)}</b><i class="${alt(s) ? 'alt' : ''}" style="height:${Math.max(2, (s.value / max) * 100)}%"></i></div>`).join('')}
    </div>
    <div class="chart-x">${series.map((s) => `<span>${esc(s.label)}</span>`).join('')}</div>`;
}

function dispatchMap(app, wo = null) {
  const S = app.sys.store;
  const pts = [];
  S.db.blocks.forEach((b) => pts.push({ ...b, kind: 'block' }));
  S.db.technicians.forEach((t) => pts.push({ ...t, kind: 'tech' }));
  const lats = pts.map((p) => p.lat), lngs = pts.map((p) => p.lng);
  const minLat = Math.min(...lats) - 0.001, maxLat = Math.max(...lats) + 0.001;
  const minLng = Math.min(...lngs) - 0.001, maxLng = Math.max(...lngs) + 0.001;
  const W = 340, H = 240;
  const x = (lng) => ((lng - minLng) / (maxLng - minLng)) * (W - 40) + 20;
  const y = (lat) => H - (((lat - minLat) / (maxLat - minLat)) * (H - 40) + 20);

  const target = wo ? { lat: wo.lat, lng: wo.lng } : null;
  const assigned = wo ? S.technician(wo.technicianId) : null;

  return `<div class="mapbox">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Campus dispatch sketch showing blocks and technician positions">
      <rect width="${W}" height="${H}" fill="#EBE5DA"/>
      ${[0, 1, 2, 3, 4].map((i) => `<line x1="0" y1="${(H / 4) * i}" x2="${W}" y2="${(H / 4) * i}" stroke="#D8D0C2" stroke-width="1"/>`).join('')}
      ${[0, 1, 2, 3, 4].map((i) => `<line y1="0" x1="${(W / 4) * i}" y2="${H}" x2="${(W / 4) * i}" stroke="#D8D0C2" stroke-width="1"/>`).join('')}
      ${assigned && target ? `<line x1="${x(assigned.lng)}" y1="${y(assigned.lat)}" x2="${x(target.lng)}" y2="${y(target.lat)}" stroke="#6E1526" stroke-width="2" stroke-dasharray="4 3"/>` : ''}
      ${S.db.blocks.map((b) => `
        <rect x="${x(b.lng) - 9}" y="${y(b.lat) - 9}" width="18" height="18" fill="#FBF9F4" stroke="#1C1A17" stroke-width="1.5"/>
        <text x="${x(b.lng)}" y="${y(b.lat) + 26}" font-size="9" text-anchor="middle" fill="#6F6960" font-family="IBM Plex Mono, monospace">${esc(b.name)}</text>`).join('')}
      ${S.db.technicians.map((t) => `
        <circle cx="${x(t.lng)}" cy="${y(t.lat)}" r="6" fill="${assigned && t.id === assigned.id ? '#2E6B4F' : '#A67C2E'}" stroke="#1C1A17" stroke-width="1.2"/>
        <text x="${x(t.lng)}" y="${y(t.lat) - 11}" font-size="9" text-anchor="middle" fill="#3A3630" font-family="IBM Plex Mono, monospace">${esc(t.name.split(' ')[0])}</text>`).join('')}
      ${target ? `<circle cx="${x(target.lng)}" cy="${y(target.lat)}" r="7" fill="none" stroke="#A3232B" stroke-width="2.5"/>` : ''}
    </svg>
    <div class="map-legend">
      <span><i style="background:#FBF9F4;border:1.5px solid #1C1A17"></i>Block</span>
      <span><i style="background:#A67C2E;border-radius:50%"></i>Technician</span>
      <span><i style="background:#2E6B4F;border-radius:50%"></i>Assigned</span>
      <span><i style="border:2px solid #A3232B;border-radius:50%"></i>Failed machine</span>
    </div>
    <div style="padding:8px 12px;border-top:1px solid var(--rule)">
      <div class="provenance">Schematic plan of DEMO coordinates — not a road map. Distance is
      straight-line × 1.35 and travel time assumes 22 km/h on a two-wheeler. With a Bengaluru Hyperlocal Logistics
      token configured, the same call returns a real vehicle-aware route and these assumptions disappear.</div>
    </div>
  </div>`;
}

function viewAgent(app, selectedId) {

  }
  const run = S.run(selectedId) || runs[0];

  return `<div class="wrap">
    ${pageHead('Agent', 'Control centre', 'What it knows, what it decided, why, and what it will do next.',
      `<button class="btn btn--quiet btn--sm" data-act="advance" data-min="15">Advance 15 min</button>

        <div class="panel__hd"><h4>Runs</h4><span class="tiny muted">${runs.length}</span></div>

            data-act="select-run" data-id="${esc(r.id)}">

            <span>${esc(titleCase(r.state))}</span>
          </button>`).join('')}
      </div>

      <div class="stack">
        ${agentConsole(app, run)}
        ${runControls(app, run)}
        ${panel('Dispatch reasoning', dispatchReasoning(app, run), { flush: false })}
        ${panel('State machine', `
          <p class="small muted">The agent executes this table. This screen renders the same table it
          executes — there are ${STATES.length} states and no hidden branch.</p>
          <div class="row row--wrap" style="gap:6px;margin-top:10px">
            ${STATES.map((s) => `<span class="tag ${s === run.state ? 'tag--p1' : ''}">${esc(s)}</span>`).join('')}
          </div>
          <div class="hr"></div>
          <div class="small"><b>${esc(run.state)}</b> — ${esc((MACHINE[run.state] || {}).description || '')}</div>
          <div class="small muted" style="margin-top:6px">On failure: ${esc((MACHINE[run.state] || {}).failure || '—')}</div>

        `)}
      </div>
    </div>
  </div>`;
}

function runControls(app, run) {
  const t = app.sys.store.ticket(run.ticketId);
  const w = run.waitingFor;
  const btn = (act, label, cls = '') => `<button class="btn btn--sm ${cls}" data-act="${act}" data-run="${esc(run.id)}">${esc(label)}</button>`;
  let body = '';
  if (w === 'TECHNICIAN_ACK') body = btn('tech-ack', 'Technician accepts', 'btn--primary') + btn('advance-to-timeout', 'Let the SLA expire', 'btn--danger');
  else if (w === 'REPAIR_DONE') body = btn('quick-done', 'Technician completes repair', 'btn--primary');
  else if (w === 'RESIDENT_VERIFY') body = btn('confirm', 'Resident confirms', 'btn--primary') + btn('dispute', 'Resident disputes', 'btn--danger');
  else if (w === 'APPROVAL') body = btn('approve', 'Warden approves', 'btn--primary') + btn('reject', 'Warden rejects', 'btn--danger');
  else if (w === 'HAZARD_CLEARED') body = btn('hazard-clear', 'Warden clears the hazard', 'btn--primary');
  else if (w === 'DIAGNOSIS') body = `<a class="btn btn--sm btn--primary" href="#/technician">Open the technician view</a>`;
  else if (w === 'HUMAN_DECISION') body = `<span class="small muted">A human must choose here. See ${t && t.hazard ? 'the hazard note' : 'the reason above'}.</span>`;
  else body = `<span class="small muted">Nothing is blocked. Advance the clock to let timers fire.</span>`;

  return `<div class="panel"><div class="panel__bd">
    <div class="eyebrow">Drive this run</div>
    <p class="small muted" style="margin:6px 0 12px">These buttons stand in for the people the agent is
    waiting on — a technician’s phone, a warden’s approval, a resident’s reply. They do not skip agent
    steps; an event raised out of sequence is refused.</p>
    <div class="row row--wrap">${body}
      <span class="grow"></span>
      <button class="btn btn--sm btn--quiet" data-act="advance" data-min="5">+5 min</button>
    </div>
  </div></div>`;
}

function dispatchReasoning(app, run) {
  const acts = app.sys.store.db.agentActions.filter((a) => a.runId === run.id && a.tool === 'find_nearest_technician');
  const a = acts[acts.length - 1];
  if (!a || !a.data) return '<div class="empty">No dispatch decision on this run yet.</div>';
  const cands = a.data.candidates || [];
  const excluded = a.data.excluded || [];
  const max = Math.max(1, ...cands.map((c) => c.score));
  return `
    <p class="small muted">Additive scoring, shown in full. The agent did not “pick someone” — it
    ranked everyone against four factors and recorded why the others were not eligible.</p>
    <div class="cands" style="margin-top:12px">
      ${cands.map((c, i) => `<div class="cand ${i === 0 ? 'cand--chosen' : ''}">
        <div class="row row--between"><b>${esc(c.name)}${i === 0 ? ' — selected' : ''}</b><span class="mono">${esc(c.score)}</span></div>
        <div class="bar" style="margin:6px 0"><i style="width:${(c.score / max) * 100}%"></i></div>
        <div class="tiny muted">${(c.factors || []).map((f) => `${esc(f.factor)} +${esc(f.points)}`).join(' · ')}</div>
        <div class="tiny muted">${esc(c.etaMinutes)} min away · ${esc(c.openJobs)} open jobs</div>
      </div>`).join('')}
      ${excluded.map((e) => `<div class="cand cand--out">
        <div class="row row--between"><span>${esc(e.name)}</span><span class="tiny">excluded</span></div>
        <div class="tiny">${esc(e.reason)}</div></div>`).join('')}
    </div>
    <div class="provenance" style="margin-top:12px">${esc(a.data.note || 'Travel estimates are DEMO values.')}</div>`;
}

function viewAnalytics(app) {
  const S = app.sys.store;
  const closed = S.db.tickets.filter((t) => t.closedAt);
  const mttr = closed.length
    ? Math.round(closed.reduce((n, t) => n + (t.closedAt - t.createdAt), 0) / closed.length / 60000)
    : null;
  const reopened = S.db.tickets.filter((t) => t.reopenCount > 0).length;
  const breaches = S.db.tickets.reduce((n, t) => n + (t.slaBreaches || []).length, 0);
  const totalSla = S.db.tickets.length * 3 || 1;
  const spend = S.db.payments.reduce((n, p) => n + p.amountPaise, 0);

  const byAsset = S.db.assets.map((a) => ({
    label: a.tag, value: S.historyFor(a.id).filter((h) => h.kind === 'FAILURE').length,
  })).filter((r) => r.value > 0).sort((x, y) => y.value - x.value);

  const ackTimes = S.db.workOrders.filter((w) => w.acknowledgedAt)
    .map((w) => Math.round((w.acknowledgedAt - w.createdAt) / 60000));

  return `<div class="wrap">
    ${pageHead('Analytics', 'Maintenance performance', 'Computed live from this session’s records. Nothing here is pre-baked.')}
    ${metrics([
      { value: mttr !== null ? `${mttr} min` : '—', label: 'Mean time to repair', note: 'Report → verified close' },
      { value: S.db.tickets.length, label: 'Incidents' },
      { value: `${Math.round(((totalSla - breaches) / totalSla) * 100)}%`, label: 'SLA compliance', tone: breaches ? 'warn' : null },
      { value: reopened, label: 'Failed verification', tone: reopened ? 'alert' : null, note: 'Technician said fixed; resident disagreed' },
      { value: rupees(spend), label: 'Parts spend this session' },
      { value: ackTimes.length ? `${Math.round(ackTimes.reduce((a, b) => a + b, 0) / ackTimes.length)} min` : '—', label: 'Avg acknowledgement' },
    ])}

    <div class="grid grid--2" style="margin-top:20px">
      ${panel('Failures by machine', byAsset.length ? barChart(byAsset, { alt: (s) => s.value >= 3 })
        + `<p class="small muted" style="margin-top:12px">Bars in brass have three or more recorded failures — the
        threshold at which NammaFix stops treating a report as an incident and starts treating the
        machine as the problem.</p>` : '<div class="empty">No failures on record.</div>')}

      ${panel('Where time goes', (() => {
        const rows = [
          ['Report → assigned', S.db.workOrders.map((w) => (w.createdAt - S.ticket(w.ticketId).createdAt) / 60000)],
          ['Assigned → acknowledged', S.db.workOrders.filter((w) => w.acknowledgedAt).map((w) => (w.acknowledgedAt - w.createdAt) / 60000)],
          ['Acknowledged → complete', S.db.workOrders.filter((w) => w.completedAt && w.acknowledgedAt).map((w) => (w.completedAt - w.acknowledgedAt) / 60000)],
          ['Complete → verified', S.db.tickets.filter((t) => t.closedAt && t.verification?.confirmedBy).map((t) => 0)],
        ];
        return rows.map(([label, arr]) => {
          const v = arr.length ? Math.round(arr.reduce((a, b) => a + b, 0) / arr.length) : null;
          return `<div class="row row--between" style="padding:7px 0;border-bottom:1px solid var(--rule-soft)">
            <span class="small">${esc(label)}</span>
            <span class="mono">${v === null ? '—' : `${v} min`}</span></div>`;
        }).join('') + `<p class="small muted" style="margin-top:12px">The agent's own share of this —
        understanding, prioritising and dispatching — is the first row. Everything below it is
        physical-world latency the agent can only chase, not remove.</p>`;
      })())}
    </div>

    <div style="margin-top:20px">
      ${panel('Insights', (() => {
        const out = [];
        const worst = byAsset[0];
        if (worst && worst.value >= 3) out.push(`${worst.label} has failed ${worst.value} times in its recorded history. Replacement is likely cheaper than the next three repairs.`);
        if (reopened) out.push(`${reopened} repair${reopened > 1 ? 's were' : ' was'} reported complete but rejected at verification. Without a verification step these would read as successes.`);
        if (breaches) out.push(`${breaches} SLA target${breaches > 1 ? 's were' : ' was'} missed. Each one triggered an escalation automatically; none required a resident to chase.`);
        if (!out.length) out.push('Not enough activity in this session to draw an operational conclusion. Run a scenario from the demo library.');
        return out.map((s) => `<div class="note small" style="margin-bottom:8px">${esc(s)}</div>`).join('')
          + `<div class="provenance" style="margin-top:8px">These sentences are generated from the
          records in this session, which are DEMO DATA. They are not findings about any real hostel.</div>`;
      })())}
    </div>
  </div>`;
}

const STORAGE_KEY = 'nammafix_v1';


const DEFAULT_USER_ID = 'u_ananya';

const app = {
  sys: null,
  session: { user: null },
  now: () => app.sys.store.clock.now(),
};

function boot() {
  app.sys = createSystem();
  const saved = (() => { try { return localStorage.getItem(STORAGE_KEY); } catch { return null; } })();
  if (saved) {
    const ok = app.sys.store.restore(saved);
    if (!ok) app.sys = createSystem(); 
  }

  
  app.sys.store.subscribe(() => {
    try { localStorage.setItem(STORAGE_KEY, app.sys.store.snapshot()); } catch {  }
  });

  
  const sessionUserId = (() => { try { return localStorage.getItem('nammafix_user') || DEFAULT_USER_ID; } catch { return DEFAULT_USER_ID; } })();
  app.session.user = app.sys.store.user(sessionUserId) || app.sys.store.user(DEFAULT_USER_ID);

  startClock();
  render();
  window.addEventListener('hashchange', render);
}





function startClock() {
  setInterval(async () => {
    
    for (const run of app.sys.store.db.agentRuns.filter((r) => !r.finished)) {
      await app.sys.agent.tick(run.id);
    }
    updateClock();
    
    renderTopbar();
  }, 5000);
  updateClock();
}

function updateClock() {
  const fc = document.getElementById('foot-clock');
  if (fc) {
    const d = new Date(app.now());
    fc.textContent = d.toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', hour12: false });
  }
}





function route() {
  const hash = location.hash.replace(/^#/, '') || '/';
  const parts = hash.split('/').filter(Boolean);
  const base = parts[0] || '';
  const seg1 = parts[1] || '';
  const seg2 = parts[2] || '';
  return { base, seg1, seg2, parts };
}

function render() {
  const r = route();
  renderTopbar();
  renderMain(r);
  window.scrollTo(0, 0);
}

  const topbar = document.getElementById('topbar');
  if (!topbar) return;

  const open = app.sys.store.openTickets().length;
  const needs = app.sys.store.db.agentRuns.filter((r) => r.requiresHuman).length;
  const role = app.session.user.role;
  const r = route();

  const navLinks = [
    { href: '#/', label: 'Home', roles: null },
    { href: '#/bob-story', label: '★ Built with IBM Bob', roles: null },

    { href: '#/agent', label: `Agent${needs ? ` ⚑${needs}` : ''}`, roles: ['WARDEN', 'ADMIN'] },
    { href: '#/assets', label: 'Machines', roles: ['TECHNICIAN', 'WARDEN', 'ADMIN'] },
    { href: '#/approvals', label: 'Approvals', roles: ['WARDEN', 'ADMIN'] },
    { href: '#/payments', label: 'Payments', roles: ['WARDEN', 'ADMIN'] },
    { href: '#/analytics', label: 'Analytics', roles: ['WARDEN', 'ADMIN'] },
    { href: '#/audit', label: 'Audit', roles: ['ADMIN'] },
    { href: '#/demo', label: 'Demo', roles: null },
    { href: '#/settings', label: 'Settings', roles: null },
  ].filter((l) => !l.roles || l.roles.includes(role));

  const currentHref = '#/' + [r.base, r.seg1, r.seg2].filter(Boolean).join('/');

  topbar.innerHTML = `<div class="topbar__in">
    <a class="brand" href="#/">
      <span class="brand__mark">ನಮ್ಮ ಫಿಕ್ಸ್</span> <span class="brand__sub">NammaFix · Built with IBM Bob</span>
    </a>
    <nav class="nav" aria-label="Main navigation">
      ${navLinks.map((l) => `<a href="${l.href}" ${l.href === currentHref ? 'aria-current="page"' : ''}>${l.label}</a>`).join('')}
    </nav>
    <div class="row" style="gap:8px;align-items:center">
      <a class="btn btn--quiet btn--sm" href="https://github.com/parthcoep-bot/TechGIG-BObothon" target="_blank" rel="noopener" title="Source code on GitHub">GitHub</a>
      <a class="btn btn--quiet btn--sm" href="https://parthcoep-bot.github.io/TechGIG-BObothon/" target="_blank" rel="noopener" title="Live demo on GitHub Pages">Live Demo</a>
      <div class="whoami">
        <span class="small">${app.session.user.name.split(' ')[0]}</span>
        <span class="eyebrow">${app.session.user.role}</span>
      </div>
    </div>
  </div>`;

function renderMain(r) {
  const main = document.getElementById('main');
  if (!main) return;

  let html = '';
  switch (r.base) {
    case '':          html = viewLanding(app); break;
    case 'bob-story': html = viewBobStory(app); break;
    case 'dashboard': html = viewDashboard(app); break;
    case 'report':    html = viewReport(app); break;
    case 'tickets':   html = r.seg1 ? viewTicket(app, r.seg1) : viewTickets(app); break;
    case 'technician':
      if (r.seg1 === 'jobs' && r.seg2) html = viewJob(app, r.seg2);
      else html = viewTechnician(app);
      break;
    case 'admin':     html = viewAdmin(app); break;
    case 'agent':     html = viewAgent(app, r.seg1 || null); break;
    case 'assets':    html = r.seg1 ? viewAsset(app, r.seg1) : viewAssets(app); break;
    case 'analytics': html = viewAnalytics(app); break;
    case 'approvals': html = viewApprovals(app); break;
    case 'payments':  html = viewPayments(app); break;
    case 'audit':     html = viewAudit(app); break;
    case 'settings':  html = viewSettings(app); break;
    case 'demo':      html = viewDemo(app); break;
    case 'voice':     html = viewVoice(app); break;
    default:          html = `<div class="wrap"><div class="empty">Page not found.</div></div>`;
  }

  main.innerHTML = html;

  
  bind(main, ACTIONS);

  
  if (r.base === 'voice') wireVoice(main);
}





const ACTIONS = {

  
  'hz': (node) => {
    document.querySelectorAll('[data-act="hz"]').forEach((b) => b.setAttribute('aria-pressed', 'false'));
    node.setAttribute('aria-pressed', 'true');
  },
  'submit-report': async () => {
    const text = ($('#rp-text')?.value || '').trim();
    if (!text) { toast('Required', 'Describe what has stopped working.'); return; }
    const hz = document.querySelector('[data-act="hz"][aria-pressed="true"]')?.dataset.v;
    if (!hz) { toast('Required', 'Please answer the safety question.'); return; }
    const assetHint = $('#rp-asset')?.value || '';
    const fullText = assetHint ? `${text} (machine tag: ${assetHint})` : text;

    try {
      const result = await app.sys.agent.intake({
        text: fullText,
        reporterId: app.session.user.id,
        hazardAnswer: hz === 'yes',
      });
      if (!result.ok && result.kind !== 'RUN_STARTED') {
        toast('Could not submit', result.error || 'Unknown error');
        return;
      }
      await app.sys.agent.runUntilBlocked(result.run.id);
      location.hash = result.ticket ? `#/tickets/${result.ticket.id}` : '#/tickets';
    } catch (e) {
      toast('Error', e.message);
    }

  'open-ticket': (node) => { location.hash = `#/tickets/${node.dataset.id}`; },

    await humanEv(node.dataset.run, 'TECHNICIAN_ACK', {});

  location.hash = '#/';
  rerender();
};

async function humanEv(runId, event, payload) {
  try {
    const result = await app.sys.agent.humanEvent(runId, event, {
      ...payload,
      actorRole: payload.actorRole || app.session.user.role,
      actor: payload.actor || app.session.user.id,
    });
    await app.sys.agent.runUntilBlocked(runId);
    return result;
  } catch (e) {
    toast('Error', e.message);
    return { ok: false, error: e.message };
  }
}

function rerender() {
  renderMain(route());
  renderTopbar();
  updateClock();
}






async function runScenario(id) {
  const sc = SCENARIOS.find((s) => s.id === id);
  if (!sc) { toast('Unknown', `No scenario ${id}`); return; }

  toast('Running', sc.name);

  try {
    switch (id) {
      case 'heater': await scenarioHeater(); break;
      case 'washer': await scenarioWasher(); break;
      case 'pump':   await scenarioPump(); break;
      case 'noack':  await scenarioNoAck(); break;
      case 'approval': await scenarioApproval(); break;
      case 'dispute':  await scenarioDispute(); break;
      case 'repeat':   await scenarioRepeat(); break;
      case 'hazard':   await scenarioHazard(); break;
      default: toast('No script', `${id} — report manually from the Report page.`); return;
    }
    rerender();
  } catch (e) {
    toast('Error in scenario', e.message);
    console.error(e);
  }
}

async function intake(text, userId, hazard = false) {
  const r = await app.sys.agent.intake({ text, reporterId: userId, hazardAnswer: hazard });
  if (!r.run) throw new Error(`intake failed: ${r.error || JSON.stringify(r)}`);
  await app.sys.agent.runUntilBlocked(r.run.id);
  return r;
}

  await humanEv(runId, 'REPAIR_DONE', { repairNotes: notes, actorRole: 'TECHNICIAN' });
}

let recognition = null;
let micOn = false;


const vc = { turns: [], hazardAsked: false, hazardAnswer: null };

function wireVoice(root) {
  vc.turns = [];
  vc.hazardAsked = false;
  vc.hazardAnswer = null;
  renderTurns(root);

  
  addTurn('agent', 'What has stopped working? Describe it the way you would to a friend.', root);
}

function addTurn(who, text, root) {
  vc.turns.push({ who, text });
  renderTurns(root || document.getElementById('main'));
}

function renderTurns(root) {
  const host = root?.querySelector('#vc-turns');
  if (!host) return;
  if (!vc.turns.length) { host.innerHTML = ''; return; }
  host.innerHTML = `<div class="turns">${vc.turns.map((t) => `
    <div class="turn turn--${t.who}">
      <div class="turn__who">${t.who === 'agent' ? 'NammaFix' : app.session.user.name}</div>
      <div>${t.text}</div>
    </div>`).join('')}</div>`;
}

function toggleMic() {
  if (micOn) { stopMic(); return; }
  if (!recognition && window.SpeechRecognition) recognition = new window.SpeechRecognition();
  if (!recognition && window.webkitSpeechRecognition) recognition = new window.webkitSpeechRecognition();

  const mic = document.getElementById('vc-mic');
  const wave = document.getElementById('vc-wave');
  const state = document.getElementById('vc-state');

  if (!recognition) {
    
    state && (state.textContent = 'Your browser does not support speech recognition. Type instead — this is not IBM Granite Speech.');
    return;
  }

  micOn = true;
  if (mic) { mic.textContent = 'Listening'; mic.dataset.on = '1'; }
  if (wave) wave.dataset.on = '1';
  if (state) state.textContent = 'Listening… (browser speech engine, not IBM Granite Speech)';

  const lang = document.getElementById('vc-lang')?.value || 'en-IN';
  recognition.lang = lang === 'en-IN-hinglish' ? 'en-IN' : lang;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  recognition.start();

  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    stopMic();
    vcSubmit(transcript);
  };
  recognition.onerror = () => { stopMic(); };
  recognition.onend = () => { if (micOn) stopMic(); };
}

function stopMic() {
  micOn = false;
  try { recognition?.stop(); } catch {  }
  const mic = document.getElementById('vc-mic');
  const wave = document.getElementById('vc-wave');
  const state = document.getElementById('vc-state');
  if (mic) { mic.textContent = 'Speak'; mic.dataset.on = '0'; }
  if (wave) wave.dataset.on = '0';
  if (state) state.textContent = 'Tap to speak, or type below.';
}

async function vcSubmit(text) {
  addTurn('user', text);

  
  if (!vc.hazardAsked) {
    vc.hazardAsked = true;
    const lo = text.toLowerCase();
    const signals = ['smoke', 'burning', 'spark', 'shock', 'exposed', 'fire', 'धुआ', 'जलन', 'करंट'];
    if (signals.some((s) => lo.includes(s))) {
      vc.hazardAnswer = true;
      addTurn('agent', 'I am treating this as a safety emergency. Do not touch the machine. I am escalating this immediately.');
    } else {
      addTurn('agent', 'Is there smoke, a burning smell, sparks, an electric shock, or exposed wiring? Reply yes or no.');
      
      vc.pendingHazardAnswer = true;
      return;
    }
  } else if (vc.pendingHazardAnswer) {
    vc.pendingHazardAnswer = false;
    const lo = text.toLowerCase();
    vc.hazardAnswer = /^(yes|haan|haan ji|ha|हाँ|हां)/.test(lo);
    if (vc.hazardAnswer) {
      addTurn('agent', 'I am treating this as a safety emergency. Do not touch the machine. I am escalating this immediately.');
    } else {
      addTurn('agent', 'Got it — no safety hazard. Submitting your report now.');
    }
  }

  
  const reportText = vc.turns.filter((t) => t.who === 'user').map((t) => t.text).join(' ');

  try {
    const result = await app.sys.agent.intake({
      text: reportText,
      reporterId: app.session.user.id,
      hazardAnswer: vc.hazardAnswer,
      source: 'VOICE',
    });
    await app.sys.agent.runUntilBlocked(result.run?.id);

    if (result.kind === 'NEEDS_INFORMATION') {
      addTurn('agent', result.question);
    } else if (result.kind === 'OUT_OF_SCOPE') {
      addTurn('agent', result.userMessage || 'This doesn\'t look like a machine failure I can handle. I\'ve logged it for the warden.');
    } else if (result.ticket) {
      const t = result.ticket;
      addTurn('agent', `Logged as ${t.id} — ${t.priority}, ${t.state}. You don't need to follow up. I'll come back to you if I need anything.`);
    }
  } catch (e) {
    addTurn('agent', 'Something went wrong on my end. Your message was heard — please try again or use the text form.');
    console.error(e);
  }
}
