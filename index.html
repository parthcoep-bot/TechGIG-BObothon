<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NammaFix (ನಮ್ಮ ಫಿಕ್ಸ್) — Student Hostel & PG Maintenance Agent · IBM Bobathon: Build for Bengaluru</title>
  <meta name="description" content="NammaFix: Autonomous Student Hostel and PG Infrastructure Maintenance Agent built with IBM Bob and watsonx Orchestrate for Bengaluru. Multilingual Kannada/English intake, 22-state deterministic agent loop, and verified repairs.">
  <style>@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');


:root {
  
  --ink:        #1C1A17;
  --ink-2:      #3A3630;
  --muted:      #6F6960;
  --muted-2:    #8C857A;
  --paper:      #F3EFE7;
  --raised:     #FBF9F4;
  --sunken:     #EBE5DA;
  --rule:       #D8D0C2;
  --rule-soft:  #E5DFD3;

  
  --burgundy:   #6E1526;
  --burgundy-d: #4A0E19;
  --burgundy-w: #F2E4E4;
  --brass:      #A67C2E;

  
  --ok:         #2E6B4F;
  --ok-w:       #E4EDE7;
  --warn:       #A8730E;
  --warn-w:     #F6EEDC;
  --crit:       #A3232B;
  --crit-w:     #F6E4E3;
  --info:       #3C5A6B;
  --info-w:     #E5EBEE;

  
  --display: "Source Serif 4", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --ui: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  
  --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
  --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;

  --r: 2px;
  --shadow: 0 8px 28px rgba(28,26,23,.18);
  --maxw: 1180px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--ui);
  font-size: 15px;
  line-height: 1.5;
  font-feature-settings: "kern" 1;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { font-family: var(--display); font-weight: 600; letter-spacing: -.01em; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(30px, 5vw, 52px); }
h2 { font-size: clamp(22px, 3vw, 30px); }
h3 { font-size: 19px; }
h4 { font-size: 16px; }
p  { margin: 0 0 var(--s3); }
a  { color: var(--burgundy); text-decoration-thickness: 1px; text-underline-offset: 2px; }


.eyebrow {
  font-family: var(--ui); font-size: 11px; font-weight: 600;
  letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
}
.eyebrow--brand { color: var(--burgundy); }
.lede { font-size: 17px; color: var(--ink-2); max-width: 62ch; }
.mono { font-family: var(--mono); font-size: 12.5px; letter-spacing: -.01em; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.nowrap { white-space: nowrap; }
.right { text-align: right; }
.hr { height: 1px; background: var(--rule); border: 0; margin: var(--s5) 0; }
.hr--thick { height: 2px; background: var(--ink); margin: var(--s4) 0; }
.stack > * + * { margin-top: var(--s3); }
.row { display: flex; gap: var(--s3); align-items: center; }
.row--wrap { flex-wrap: wrap; }
.row--between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}


.section-no {
  font-family: var(--mono); font-size: 12px; color: var(--brass);
  border-top: 2px solid var(--ink); padding-top: var(--s2);
  display: inline-block; min-width: 40px;
}


.shell { min-height: 100vh; display: flex; flex-direction: column; }

.topbar {
  border-bottom: 1px solid var(--rule);
  background: var(--raised);
  position: sticky; top: 0; z-index: 40;
}
.topbar__in {
  max-width: var(--maxw); margin: 0 auto; padding: 0 var(--s4);
  display: flex; align-items: center; gap: var(--s4); min-height: 56px;
}
.brand { display: flex; align-items: baseline; gap: var(--s2); text-decoration: none; color: var(--ink); }
.brand__mark {
  font-family: var(--display); font-size: 21px; font-weight: 600;
  letter-spacing: -.02em; color: var(--burgundy);
}
.brand__sub { font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }

.nav { display: flex; gap: 2px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a {
  font-size: 13px; color: var(--ink-2); text-decoration: none;
  padding: var(--s2) var(--s3); border-bottom: 2px solid transparent; white-space: nowrap;
}
.nav a:hover { color: var(--burgundy); }
.nav a[aria-current="page"] { color: var(--burgundy); border-bottom-color: var(--burgundy); font-weight: 600; }

.whoami {
  display: flex; align-items: center; gap: var(--s2);
  border-left: 1px solid var(--rule); padding-left: var(--s3); margin-left: var(--s2);
}

.main { flex: 1; }
.wrap { max-width: var(--maxw); margin: 0 auto; padding: var(--s6) var(--s4) var(--s8); }
.wrap--narrow { max-width: 680px; }

.foot {
  border-top: 1px solid var(--rule); background: var(--raised);
  font-size: 12.5px; color: var(--muted);
}
.foot__in { max-width: var(--maxw); margin: 0 auto; padding: var(--s5) var(--s4); }


.page-head { border-bottom: 2px solid var(--ink); padding-bottom: var(--s3); margin-bottom: var(--s5); }
.page-head .row { align-items: flex-end; }


.panel { background: var(--raised); border: 1px solid var(--rule); border-radius: var(--r); }
.panel__hd {
  padding: var(--s3) var(--s4); border-bottom: 1px solid var(--rule);
  display: flex; align-items: center; gap: var(--s3); justify-content: space-between;
}
.panel__bd { padding: var(--s4); }
.panel__bd--flush { padding: 0; }

.grid { display: grid; gap: var(--s4); }
.grid--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid--4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid--side { grid-template-columns: minmax(0, 1fr) 340px; }
.grid--side-l { grid-template-columns: 300px minmax(0, 1fr); }


.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); border: 1px solid var(--rule); background: var(--raised); }
.metric { padding: var(--s3) var(--s4); border-right: 1px solid var(--rule); }
.metric:last-child { border-right: 0; }
.metric__v { font-family: var(--display); font-size: 27px; font-weight: 600; line-height: 1.05; }
.metric__l { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
.metric__n { font-size: 12px; color: var(--muted); margin-top: var(--s1); }
.metric--alert .metric__v { color: var(--crit); }
.metric--warn .metric__v { color: var(--warn); }


table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
thead th {
  text-align: left; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); font-weight: 600; padding: var(--s2) var(--s4);
  border-bottom: 1px solid var(--rule); background: var(--sunken); white-space: nowrap;
}
tbody td { padding: var(--s3) var(--s4); border-bottom: 1px solid var(--rule-soft); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--sunken); }
.tbl-wrap { overflow-x: auto; }


.st { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.st--ok::before { background: var(--ok); }
.st--warn::before { background: var(--warn); }
.st--crit::before { background: var(--crit); }
.st--info::before { background: var(--info); }
.st--ok { color: var(--ok); } .st--warn { color: var(--warn); }
.st--crit { color: var(--crit); } .st--info { color: var(--info); }

.tag {
  display: inline-block; font-family: var(--mono); font-size: 11px; letter-spacing: .02em;
  padding: 1px 5px; border: 1px solid var(--rule); border-radius: var(--r);
  background: var(--sunken); color: var(--ink-2);
}
.tag--p0 { border-color: var(--crit); background: var(--crit-w); color: var(--crit); font-weight: 600; }
.tag--p1 { border-color: var(--warn); background: var(--warn-w); color: var(--warn); font-weight: 600; }
.tag--p2 { border-color: var(--info); background: var(--info-w); color: var(--info); }
.tag--p3 { }
.tag--live { border-color: var(--ok); background: var(--ok-w); color: var(--ok); }
.tag--sandbox { border-color: var(--info); background: var(--info-w); color: var(--info); }
.tag--demo { border-color: var(--brass); background: #F7F0DF; color: #7A5A1C; }


.provenance {
  font-family: var(--mono); font-size: 11px; color: var(--muted);
  border-left: 2px solid var(--brass); padding: 2px 0 2px var(--s2);
}


.btn {
  font-family: var(--ui); font-size: 13.5px; font-weight: 500;
  padding: 9px var(--s4); border-radius: 3px; border: 1px solid var(--ink);
  background: var(--raised); color: var(--ink); cursor: pointer;
  display: inline-flex; align-items: center; gap: var(--s2); text-decoration: none;
  transition: background .12s ease, color .12s ease;
}
.btn:hover { background: var(--sunken); }
.btn--primary { background: var(--burgundy); border-color: var(--burgundy); color: #fff; }
.btn--primary:hover { background: var(--burgundy-d); border-color: var(--burgundy-d); }
.btn--quiet { border-color: var(--rule); color: var(--ink-2); }
.btn--quiet:hover { border-color: var(--ink); }
.btn--danger { border-color: var(--crit); color: var(--crit); }
.btn--danger:hover { background: var(--crit-w); }
.btn--sm { padding: 5px 10px; font-size: 12.5px; }
.btn--lg { padding: 13px var(--s5); font-size: 15px; }
.btn--block { width: 100%; justify-content: center; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

label { display: block; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
input[type="text"], input[type="number"], textarea, select {
  width: 100%; font-family: var(--ui); font-size: 14.5px; color: var(--ink);
  background: #fff; border: 1px solid var(--rule); border-radius: var(--r);
  padding: 9px var(--s3);
}
textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
input:focus, textarea:focus, select:focus, .btn:focus-visible, a:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--burgundy); outline-offset: 1px;
}
.field + .field { margin-top: var(--s4); }
.hint { font-size: 12.5px; color: var(--muted); margin-top: 5px; text-transform: none; letter-spacing: 0; font-weight: 400; }

.choices { display: grid; gap: var(--s2); grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.choice {
  border: 1px solid var(--rule); border-radius: var(--r); background: var(--raised);
  padding: var(--s3); cursor: pointer; text-align: left; font-family: var(--ui); font-size: 14px;
}
.choice:hover { border-color: var(--ink); }
.choice[aria-pressed="true"] { border-color: var(--burgundy); background: var(--burgundy-w); }
.choice b { display: block; font-weight: 600; }
.choice span { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }


.console { border: 1px solid var(--ink); background: var(--raised); border-radius: var(--r); }
.console__hd {
  background: var(--burgundy); color: #fff; padding: var(--s3) var(--s4);
  display: flex; align-items: baseline; gap: var(--s3); flex-wrap: wrap;
}
.console__id { font-family: var(--mono); font-size: 12px; opacity: .85; }
.console__goal { font-family: var(--display); font-size: 18px; font-weight: 600; }
.console__grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
.console__col { padding: var(--s4); }
.console__col + .console__col { border-left: 1px solid var(--rule); }
.console__field { border-top: 1px solid var(--rule-soft); padding-top: var(--s2); margin-top: var(--s3); }
.console__field:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
.console__k { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.console__v { font-size: 14.5px; margin-top: 2px; }


.plan { list-style: none; margin: 0; padding: 0; }
.plan li {
  display: grid; grid-template-columns: 18px 1fr; gap: var(--s2);
  padding: 5px 0; border-bottom: 1px solid var(--rule-soft); font-size: 13.5px;
}
.plan li:last-child { border-bottom: 0; }
.plan__m { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.plan li[data-s="DONE"] .plan__m { color: var(--ok); }
.plan li[data-s="RUNNING"] { background: var(--warn-w); }
.plan li[data-s="RUNNING"] .plan__m { color: var(--warn); }
.plan li[data-s="PENDING"] { color: var(--muted); }
.plan__note { font-size: 12px; color: var(--muted); grid-column: 2; }


.ledger { font-size: 13px; }
.ledger__row { display: grid; grid-template-columns: 62px 132px 1fr; gap: var(--s3); padding: var(--s2) var(--s4); border-bottom: 1px solid var(--rule-soft); }
.ledger__row:nth-child(odd) { background: #F7F4EC; }
.ledger__t { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.ledger__tool { font-family: var(--mono); font-size: 11.5px; color: var(--burgundy); word-break: break-word; }
.ledger__why { color: var(--ink-2); }
.ledger__why .r { display: block; color: var(--muted); font-size: 12px; }
.ledger__row--denied { background: var(--crit-w) !important; }


.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 58px 1fr; gap: var(--s3); padding: var(--s2) 0; border-bottom: 1px solid var(--rule-soft); }
.tl li:last-child { border-bottom: 0; }
.tl__t { font-family: var(--mono); font-size: 11.5px; color: var(--muted); padding-top: 2px; }
.tl__k { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tl__m { font-size: 13.5px; }


.needs {
  border: 1px solid var(--warn); border-left: 4px solid var(--warn);
  background: var(--warn-w); padding: var(--s3) var(--s4); border-radius: var(--r);
}
.needs--crit { border-color: var(--crit); border-left-color: var(--crit); background: var(--crit-w); }
.needs__t { font-weight: 600; font-size: 14px; }

.note {
  border: 1px solid var(--rule); border-left: 3px solid var(--brass);
  background: var(--raised); padding: var(--s3) var(--s4); font-size: 13px; border-radius: var(--r);
}
.note--crit { border-left-color: var(--crit); background: var(--crit-w); border-color: var(--crit); }
.note--ok { border-left-color: var(--ok); background: var(--ok-w); border-color: var(--ok); }


.mapbox { border: 1px solid var(--rule); background: var(--sunken); border-radius: var(--r); position: relative; }
.mapbox svg { display: block; width: 100%; height: auto; }
.map-legend { display: flex; gap: var(--s4); flex-wrap: wrap; font-size: 12px; color: var(--muted); padding: var(--s2) var(--s3); border-top: 1px solid var(--rule); }
.map-legend i { width: 9px; height: 9px; display: inline-block; margin-right: 5px; }


.cands { font-size: 13px; }
.cand { border-bottom: 1px solid var(--rule-soft); padding: var(--s3) 0; }
.cand:last-child { border-bottom: 0; }
.cand--chosen { border-left: 3px solid var(--ok); padding-left: var(--s3); }
.cand--out { color: var(--muted); }
.bar { height: 6px; background: var(--sunken); border: 1px solid var(--rule); border-radius: 1px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--burgundy); }


.mic {
  width: 104px; height: 104px; border-radius: 50%; border: 2px solid var(--burgundy);
  background: var(--raised); color: var(--burgundy); cursor: pointer;
  display: grid; place-items: center; font-family: var(--ui); font-size: 12px;
  font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
}
.mic[data-on="1"] { background: var(--burgundy); color: #fff; }
.wave { display: flex; align-items: flex-end; gap: 3px; height: 34px; }
.wave i { width: 3px; background: var(--burgundy); opacity: .55; height: 20%; }
.wave[data-on="1"] i { animation: w .7s ease-in-out infinite; }
.wave i:nth-child(2n) { animation-delay: .1s } .wave i:nth-child(3n) { animation-delay: .22s }
.wave i:nth-child(5n) { animation-delay: .34s } .wave i:nth-child(7n) { animation-delay: .46s }
@keyframes w { 0%,100% { height: 18% } 50% { height: 92% } }

.turns { border: 1px solid var(--rule); border-radius: var(--r); background: var(--raised); }
.turn { padding: var(--s3) var(--s4); border-bottom: 1px solid var(--rule-soft); }
.turn:last-child { border-bottom: 0; }
.turn__who { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.turn--agent { background: #F7F4EC; }
.turn--agent .turn__who { color: var(--burgundy); }


.hero { border-bottom: 2px solid var(--ink); padding: var(--s7) 0 var(--s6); }
.hero h1 { max-width: 15ch; }
.hero__grid { display: grid; grid-template-columns: minmax(0,1fr) 400px; gap: var(--s7); align-items: start; }
.flow { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.flow b { font-weight: 600; color: var(--ink); letter-spacing: .1em; }
.flow span { color: var(--brass); }

.rails { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); border-top: 1px solid var(--rule); }
.rail { padding: var(--s4) var(--s4) var(--s4) 0; border-right: 1px solid var(--rule); padding-right: var(--s4); }
.rail:last-child { border-right: 0; }
.rail h4 { margin-bottom: var(--s1); }
.rail p { font-size: 13px; color: var(--ink-2); margin: 0; }
.rail--proposed { background: #F7F4EC; padding-left: var(--s4); }

.ba { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); border: 1px solid var(--rule); }
.ba > div { padding: var(--s4); }
.ba > div:first-child { border-right: 1px solid var(--rule); background: var(--sunken); }
.ba ul { margin: 0; padding-left: 18px; font-size: 13.5px; }
.ba li { margin-bottom: 5px; }


.scrim { position: fixed; inset: 0; background: rgba(28,26,23,.45); display: grid; place-items: center; padding: var(--s4); z-index: 90; }
.modal { background: var(--raised); border: 1px solid var(--ink); border-radius: var(--r); box-shadow: var(--shadow); max-width: 520px; width: 100%; max-height: 86vh; overflow: auto; }
.modal__hd { padding: var(--s4); border-bottom: 1px solid var(--rule); }
.modal__bd { padding: var(--s4); }
.modal__ft { padding: var(--s3) var(--s4); border-top: 1px solid var(--rule); display: flex; gap: var(--s2); justify-content: flex-end; }


.toasts { position: fixed; right: var(--s4); bottom: var(--s4); z-index: 95; display: flex; flex-direction: column; gap: var(--s2); max-width: 340px; }
.toast { background: var(--ink); color: var(--paper); padding: var(--s3) var(--s4); border-radius: var(--r); font-size: 13px; box-shadow: var(--shadow); }
.toast b { display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }


.chart { display: flex; align-items: flex-end; gap: 6px; height: 120px; border-bottom: 1px solid var(--ink); padding-top: var(--s3); }
.chart > div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
.chart i { display: block; width: 100%; background: var(--burgundy); }
.chart i.alt { background: var(--brass); }
.chart b { font-size: 10px; font-weight: 500; color: var(--muted); margin-bottom: 3px; font-family: var(--mono); }
.chart-x { display: flex; gap: 6px; padding-top: 5px; }
.chart-x > span { flex: 1; text-align: center; font-size: 10.5px; color: var(--muted); }


.empty { padding: var(--s6) var(--s4); text-align: center; color: var(--muted); font-size: 14px; }


@media (max-width: 960px) {
  .grid--side, .grid--side-l, .hero__grid { grid-template-columns: minmax(0,1fr); }
  .grid--4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .rails { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .rail:nth-child(2) { border-right: 0; }
  .console__grid { grid-template-columns: minmax(0,1fr); }
  .console__col + .console__col { border-left: 0; border-top: 1px solid var(--rule); }
}
@media (max-width: 680px) {
  .wrap { padding: var(--s5) var(--s3) var(--s7); }
  .grid--2, .grid--3, .grid--4, .ba { grid-template-columns: minmax(0,1fr); }
  .ba > div:first-child { border-right: 0; border-bottom: 1px solid var(--rule); }

const SAFETY_TERMS = {
  SMOKE: ['smoke', 'smoking', 'hoge', 'dhuan', 'dhuaan', 'ಹೊಗೆ', 'धुआं', 'धुआँ'],
  BURNING: ['burning smell', 'burning', 'urita ide', 'burnt smell', 'jal raha', 'jal rahi', 'jalne ki', 'smell of burning', 'jali hui', 'ಉರಿಯುತ್ತಿದೆ'],
  SHOCK: ['shock', 'current lag', 'current laga', 'current hodita ide', 'electric shock', 'jhatka', 'karant', 'ಕರೆಂಟ್ ಶಾಕ್', 'झटका'],
  SPARK: ['spark', 'sparking', 'kidi', 'chingari', 'arcing', 'flash', 'ಕಿಡಿ'],
  EXPOSED_WIRE: ['exposed wire', 'open wire', 'bare wire', 'naked wire', 'wire cut', 'khula taar', 'taar dikh'],
  WATER_ON_ELECTRICS: ['water on the switch', 'water in socket', 'leaking onto', 'water near wire', 'wet socket', 'water in the board'],
  GAS: ['gas leak', 'gas smell', 'lpg smell'],
};

const PRIORITIES = ['P0', 'P1', 'P2', 'P3'];





function safetyPolicy({ text = '', hazardAnswer = null, assetType = null }) {
  const hay = String(text).toLowerCase();
  const hits = [];
  for (const [key, terms] of Object.entries(SAFETY_TERMS)) {
    if (terms.some((t) => hay.includes(t))) hits.push(key);
  }
  if (hazardAnswer === true) hits.push('RESIDENT_CONFIRMED_HAZARD');

  const hazard = hits.length > 0;
  return {
    hazard,
    signals: hits,
    forcedPriority: hazard ? 'P0' : null,
    requiresHumanImmediately: hazard,
    
    residentInstruction: hazard
      ? 'Do not use or touch this machine. Stay away from it. A warden has been paged now.'
      : null,
    forbiddenInstructions: [
      'do not tell the resident to open, reset, dry, tape, rewire or restart electrical equipment',
      'do not tell the resident to isolate the mains',
      'do not tell the resident it is safe to use',
    ],
    rationale: hazard
      ? `Hazard signals detected (${hits.join(', ')}). Safety policy forces P0 and immediate human escalation; the agent may not attempt autonomous resolution.`
      : 'No hazard signals present in the report or the hazard question.',
    assetType,
  };
}





function priorityPolicy({
  safety,
  essential = false,
  servesResidents = 1,
  failuresLast90Days = 0,
  hoursSinceLastFailure = null,
  localHour = 12,
  duplicateReports = 1,
  functionLost = 'FULL', 
}) {
  if (safety && safety.forcedPriority) {
    return {
      priority: safety.forcedPriority,
      score: 100,
      factors: [{ factor: 'Safety override', points: 100, detail: safety.signals.join(', ') }],
      rationale: safety.rationale,
      overridden: true,
    };
  }

  const factors = [];
  const add = (factor, points, detail) => { if (points) factors.push({ factor, points, detail }); };

  add('Essential service', essential ? 25 : 0, essential ? 'Machine type is classified essential' : '');
  
  
  
  const reach =
    servesResidents >= 300 ? 25 : servesResidents >= 150 ? 20 : servesResidents >= 40 ? 14 : servesResidents >= 15 ? 9 : 4;
  add('Residents affected', reach, `${servesResidents} residents depend on this asset`);
  const recur = failuresLast90Days >= 3 ? 20 : failuresLast90Days === 2 ? 12 : failuresLast90Days === 1 ? 6 : 0;
  add('Recurrence', recur, `${failuresLast90Days} failure(s) in the last 90 days`);
  if (hoursSinceLastFailure !== null && hoursSinceLastFailure <= 72) {
    add('Repeat inside 72h', 10, `Last failure ${Math.round(hoursSinceLastFailure)}h ago`);
  }
  const peak = localHour >= 18 && localHour <= 23 ? 10 : localHour >= 6 && localHour <= 9 ? 8 : 0;
  add('Peak demand window', peak, peak ? `Reported at ${String(localHour).padStart(2, '0')}:00 local` : '');
  const dup = duplicateReports >= 4 ? 12 : duplicateReports >= 2 ? 7 : 0;
  add('Independent corroboration', dup, dup ? `${duplicateReports} separate residents reported this` : '');
  const loss = functionLost === 'FULL' ? 10 : functionLost === 'PARTIAL' ? 5 : 2;
  add('Loss of function', loss, functionLost);

  const score = factors.reduce((s, f) => s + f.points, 0);
  const priority = score >= 75 ? 'P1' : score >= 45 ? 'P2' : 'P3';

  return {
    priority,
    score,
    factors,
    rationale:
      `Score ${score}/112 from ${factors.length} factors → ${priority}. ` +
      'P0 is reserved for hazards only; the agent cannot reach P0 through scoring.',
    overridden: false,
  };
}




function slaPolicy(priority, slaRules) {
  const rule = slaRules.find((r) => r.priority === priority) || slaRules[slaRules.length - 1];
  return { ...rule, rationale: `SLA band for ${priority} as configured by the estate manager.` };
}





function spendingPolicy({ amountPaise, ticketSpentPaise = 0, policy, vendorEmpanelled = true, hazardTicket = false, approval = null }) {
  const reasons = [];
  const checks = [
    { name: 'Per transaction', ok: amountPaise <= policy.agentPerTransactionPaise, limit: policy.agentPerTransactionPaise, value: amountPaise },
    { name: 'Per ticket total', ok: amountPaise + ticketSpentPaise <= policy.agentPerTicketPaise, limit: policy.agentPerTicketPaise, value: amountPaise + ticketSpentPaise },
    { name: 'Daily total', ok: amountPaise + policy.spentTodayPaise <= policy.agentDailyPaise, limit: policy.agentDailyPaise, value: amountPaise + policy.spentTodayPaise },
  ];

  if (!vendorEmpanelled) {
    return { decision: 'FORBIDDEN', checks, reasons: ['Vendor is not empanelled. The agent may never pay an unknown payee.'], rationale: 'Payee allow-list failed.' };
  }
  
  
  if (approval && approval.status === 'APPROVED' && approval.amountPaise === amountPaise && amountPaise <= policy.hardCeilingPaise) {
    return { decision: 'AUTONOMOUS', authorisedBy: approval.decidedBy, approvalId: approval.id, checks: [], reasons: [`Approved by ${approval.decidedBy} at ${new Date(approval.decidedAt).toISOString()}.`], rationale: `Executing an approved instruction (${approval.id}), not an autonomous spend.` };
  }
  if (amountPaise > policy.hardCeilingPaise) {
    return { decision: 'FORBIDDEN', checks, reasons: [`Above the hard ceiling of ₹${policy.hardCeilingPaise / 100}. No in-app approver may authorise this.`], rationale: 'Hard ceiling exceeded.' };
  }
  if (hazardTicket) {
    return { decision: 'HUMAN_APPROVAL', checks, reasons: ['Ticket is a safety escalation. Spend on hazard tickets is never autonomous.'], rationale: 'Hazard ticket — human approval forced.' };
  }

  const failed = checks.filter((c) => !c.ok);
  if (failed.length === 0) {
    return { decision: 'AUTONOMOUS', checks, reasons: ['All three ceilings satisfied.'], rationale: `₹${amountPaise / 100} is inside the agent's delegated envelope.` };
  }
  failed.forEach((f) => reasons.push(`${f.name} ceiling exceeded: ₹${f.value / 100} vs ₹${f.limit / 100}.`));
  const approver = amountPaise <= policy.wardenPerTransactionPaise ? 'WARDEN' : 'ADMIN';
  return { decision: 'HUMAN_APPROVAL', approver, checks, reasons, rationale: `Outside the delegated envelope. Routed to ${approver}.` };
}

const FORBIDDEN_FOR_AGENT = [
  'create_asset_record',        
  'delete_any_record',
  'override_safety_priority',
  'close_hazard_ticket',        
  'pay_unlisted_payee',
  'instruct_electrical_handling',
  'contact_resident_after_optout',
  'modify_spend_policy',
];

function authorizationPolicy(actorRole, action) {
  if (actorRole === 'AGENT' && FORBIDDEN_FOR_AGENT.includes(action)) {
    return { allowed: false, rationale: `"${action}" is on the agent's forbidden list.` };
  }
  const perms = PERMISSIONS[actorRole] || [];
  const allowed = perms.includes('*') || perms.includes(action);
  return { allowed, rationale: allowed ? `${actorRole} holds "${action}".` : `${actorRole} does not hold "${action}".` };
}





function verificationPolicy({ priority, hazard = false, recurring = false, reopenCount = 0 }) {
  if (hazard) {
    return { method: 'HUMAN_SIGNOFF', verifier: 'WARDEN', windowMinutes: 120, autoCloseAllowed: false, rationale: 'Hazard tickets require a warden to physically sign off. Resident confirmation is not sufficient.' };
  }
  if (recurring || reopenCount >= 1) {
    return { method: 'RESIDENT_PLUS_COOLDOWN', verifier: 'REPORTER', windowMinutes: 180, cooldownHours: 48, autoCloseAllowed: false, rationale: 'Repeat or reopened failure: the agent holds the ticket in a 48h cooldown watch after confirmation before final closure.' };
  }
  const windowMinutes = priority === 'P1' ? 120 : 240;
  return { method: 'RESIDENT_CONFIRMATION', verifier: 'REPORTER', windowMinutes, autoCloseAllowed: true, escalateAfterSilentWindows: 2, rationale: `Reporter confirms within ${windowMinutes} minutes. After two unanswered attempts the agent asks a second independent resident on the same floor before provisional closure.` };
}




function escalationPolicy({ breachType, priority, attempts = 0, hazard = false }) {
  if (hazard) return { level: 3, target: 'WARDEN', channel: 'CALL', rationale: 'Hazard — page the warden by voice call immediately, do not wait for an SLA timer.' };
  const ladder = [
    { level: 1, target: 'TECHNICIAN', channel: 'CALL', note: 'Re-page the assigned technician by voice.' },
    { level: 2, target: 'NEXT_TECHNICIAN', channel: 'PUSH', note: 'Reassign to the next-best technician and inform the first.' },
    { level: 3, target: 'WARDEN', channel: 'CALL', note: 'Hand the decision to the warden with the full run history attached.' },
    { level: 4, target: 'ADMIN', channel: 'EMAIL', note: 'Estate manager. Agent stops autonomous attempts.' },
  ];
  const idx = Math.min(attempts, ladder.length - 1);
  const step = ladder[idx];
  return { ...step, breachType, priority, rationale: `${breachType} breach, escalation attempt ${attempts + 1} → ${step.target}. ${step.note}` };
}




function duplicatePolicy({ assetId, openTickets, withinMinutes = 240, now }) {
  const match = openTickets.find(
    (t) => t.assetId === assetId && !['CLOSED', 'NO_ISSUE'].includes(t.state) && now - t.createdAt <= withinMinutes * 60000,
  );
  if (!match) return { duplicate: false, rationale: 'No open ticket on this asset inside the dedup window.' };
  return {
    duplicate: true,
    ticketId: match.id,
    rationale: `An open ticket (${match.id}) already exists on this asset, raised ${Math.round((now - match.createdAt) / 60000)} minutes ago. Attaching as corroboration rather than creating a second work order.`,
  };
}







let counters = {};
function nextId(prefix) {
  counters[prefix] = (counters[prefix] || 0) + 1;
  return `${prefix}_${String(counters[prefix]).padStart(4, '0')}`;
}

function createStore(opts = {}) {
  const db = buildSeed();
  const listeners = new Set();
  counters = {};

  const clock = {
    t: opts.startAt || SIM_START,
    now() { return this.t; },
    advance(minutes) { this.t += minutes * 60000; return this.t; },
    setTo(ms) { this.t = ms; },
  };

  function emit(type, payload) {
    for (const l of listeners) { try { l(type, payload); } catch (e) {  } }
  }

  
  function audit({ actor, actorRole, action, entity, entityId, before, after, rationale, outcome = 'OK' }) {
    const row = {
      id: nextId('aud'), at: clock.now(), actor, actorRole, action, entity, entityId,
      before: redact(before), after: redact(after), rationale, outcome,
    };
    db.auditLogs.push(row);
    emit('audit', row);
    return row;
  }

  
  function redact(obj) {
    if (obj == null) return obj;
    const SENSITIVE = /(secret|token|apikey|api_key|password|authorization|credential|mandate_ref|upi)/i;
    const walk = (v) => {
      if (Array.isArray(v)) return v.map(walk);
      if (v && typeof v === 'object') {
        const out = {};
        for (const [k, val] of Object.entries(v)) out[k] = SENSITIVE.test(k) ? '[redacted]' : walk(val);
        return out;
      }
      if (typeof v === 'string' && /^\+?\d[\d\s-]{7,}$/.test(v)) return v.slice(0, 3) + '***' + v.slice(-3);
      return v;
    };
    return walk(obj);
  }

  const api = {
    db, clock, audit, redact, emit,
    subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },
    id: nextId,

    
    asset: (id) => db.assets.find((a) => a.id === id),
    assetByTag: (tag) => db.assets.find((a) => a.tag.toLowerCase() === String(tag).toLowerCase()),
    machineType: (key) => db.machineTypes.find((m) => m.key === key),
    ticket: (id) => db.tickets.find((t) => t.id === id),
    run: (id) => db.agentRuns.find((r) => r.id === id),
    runForTicket: (ticketId) => db.agentRuns.find((r) => r.ticketId === ticketId),
    workOrder: (id) => db.workOrders.find((w) => w.id === id),
    technician: (id) => db.technicians.find((t) => t.id === id),
    user: (id) => db.users.find((u) => u.id === id),
    block: (id) => db.blocks.find((b) => b.id === id),
    hostel: (id) => db.hostels.find((h) => h.id === id),
    part: (id) => db.spareParts.find((p) => p.id === id),
    inventoryFor: (partId) => db.inventory.find((i) => i.partId === partId),
    vendorFor: (partId) => db.vendors.find((v) => v.parts.includes(partId) && v.empanelled),
    historyFor: (assetId) => db.machineHistory.filter((h) => h.assetId === assetId).sort((a, b) => b.at - a.at),
    openTickets: () => db.tickets.filter((t) => !['CLOSED', 'NO_ISSUE'].includes(t.state)),

    ticketEvent(ticketId, kind, message, meta = {}) {
      const ev = { id: nextId('tev'), ticketId, at: clock.now(), kind, message, meta };
      db.ticketEvents.push(ev);
      emit('ticketEvent', ev);
      return ev;
    },

    notify({ to, role, event, title, body, ticketId = null, channel = 'IN_APP', requiresAction = false }) {
      const n = {
        id: nextId('ntf'), at: clock.now(), to, role, event, title, body, ticketId,
        channel, requiresAction, read: false, deliveryStatus: 'DELIVERED_IN_APP',
      };
      db.notifications.push(n);
      emit('notification', n);
      return n;
    },

    
    snapshot() { return JSON.stringify({ db, t: clock.t, counters }); },
    restore(json) {
      try {
        const parsed = JSON.parse(json);
        if (!parsed || !parsed.db) return false;
        for (const k of Object.keys(db)) delete db[k];
        Object.assign(db, parsed.db);
        clock.t = parsed.t;
        counters = parsed.counters || {};
        return true;
      } catch { return false; }
    },
  };

  return api;
}

  { department: 'Campus IT helpdesk', terms: ['wifi', 'wi-fi', 'internet', 'network', 'router', 'lan', 'broadband'] },
  { department: 'Civil works desk', terms: ['door', 'window', 'lock', 'leak in the wall', 'seepage', 'furniture', 'bed frame', 'almirah'] },
  { department: 'Housekeeping', terms: ['garbage', 'cleaning', 'toilet blocked', 'dustbin', 'safai'] },
  { department: 'Estate electrical desk', terms: ['tube light', 'bulb', 'ceiling fan', 'street light', 'corridor light'] },
];

function detectOutOfScope(text) {
  const hay = String(text || '').toLowerCase();
  for (const e of OUT_OF_SCOPE) for (const t of e.terms) if (hay.includes(t)) return { outOfScope: true, department: e.department, matched: t };
  return { outOfScope: false };
}

const FUNCTION_LOST = [
  { value: 'FULL', terms: ['not working', 'nahi chal', 'nahi ho raha', 'dead', 'no output', "isn't working", 'not turning on', 'band hai', 'kaam nahi', 'completely', 'बंद', 'नहीं चल'] },
  { value: 'PARTIAL', terms: ['lukewarm', 'not hot enough', 'weak', 'slow', 'thanda', 'halka garam', 'low pressure', 'barely'] },
  { value: 'INTERMITTENT', terms: ['sometimes', 'on and off', 'kabhi kabhi', 'intermittent', 'randomly', 'then stops'] },
];

const NEGATION = ['no ', 'not ', 'nahi', 'nope', 'none', 'nothing', 'clear', "isn't", 'na '];

function findTerm(text, lexicon) {
  const hay = text.toLowerCase();
  let best = null;
  for (const entry of lexicon) {
    for (const t of entry.terms) {
      const i = hay.indexOf(t);
      if (i >= 0 && (!best || t.length > best.matchedLength)) best = { ...entry, matched: t, matchedLength: t.length, at: i };
    }
  }
  return best;
}


function extractSlots(utterance, context = {}) {
  const text = String(utterance || '');
  const machine = findTerm(text, MACHINE_LEXICON);
  const block = findTerm(text, BLOCK_LEXICON);
  const floor = findTerm(text, FLOOR_LEXICON);
  const fn = findTerm(text, FUNCTION_LOST);

  
  const tagMatch = text.match(/\b(wh|wm|wp|ro|ac)[\s-]?0?(\d{1,2})\b/i);
  const assetTag = tagMatch ? `${tagMatch[1].toUpperCase()}-${tagMatch[2].padStart(2, '0')}` : null;

  
  let floorValue = floor ? floor.floor : null;
  if (floorValue === null) {
    const bare = text.toLowerCase().match(/\b(ground|first|second|third|fourth|1st|2nd|3rd|4th)\b/);
    if (bare) {
      const map = { ground: 0, first: 1, second: 2, third: 3, fourth: 4, '1st': 1, '2nd': 2, '3rd': 3, '4th': 4 };
      floorValue = map[bare[1]];
    }
  }

  const slots = {
    assetTag,
    machineType: machine ? machine.key : context.machineType || null,
    blockName: block ? block.name : context.blockName || null,
    floor: floorValue !== null && floorValue !== undefined ? floorValue : (context.floor ?? null),
    functionLost: fn ? fn.value : 'FULL',
  };

  const evidence = {
    machineType: machine ? machine.matched : null,
    blockName: block ? block.matched : null,
    floor: floor ? floor.matched : (floorValue !== null ? 'ordinal' : null),
    functionLost: fn ? fn.matched : 'default: full loss assumed',
    assetTag: tagMatch ? tagMatch[0] : null,
  };

  
  const resolved = [slots.assetTag, slots.machineType, slots.blockName, slots.floor].filter((v) => v !== null && v !== undefined).length;
  const confidence = slots.assetTag ? 1.0 : Math.min(0.95, resolved / 4);

  const missing = [];
  if (!slots.assetTag) {
    if (!slots.machineType) missing.push('machineType');
    if (!slots.blockName) missing.push('blockName');
    if (slots.floor === null || slots.floor === undefined) missing.push('floor');
  }

  return { slots, evidence, confidence, missing, rawLength: text.length, extractor: 'rule-based (no model)' };
}


function nextQuestion(missing) {
  const q = {
    machineType: 'Which machine is it — the water heater, washing machine, pump, cooler or the RO?',
    blockName: 'Which block are you in?',
    floor: 'Which floor?',
  };
  return missing.length ? { slot: missing[0], text: q[missing[0]] } : null;
}


const HAZARD_QUESTION =
  'Before I assign anyone — is there any smoke, burning smell, sparking, exposed wiring, or did anyone get a shock?';


function parseYesNo(text) {
  const t = String(text || '').toLowerCase().trim();
  if (!t) return null;
  const yes = ['yes', 'yeah', 'yep', 'haan', 'han', 'ha ', 'ji haan', 'yes there is', 'हाँ', 'हां', 'true', 'correct', 'sahi'];
  const no = ['no', 'nope', 'nahi', 'nahin', 'nothing', 'none', 'no smoke', 'all clear', 'नहीं', 'kuch nahi', 'false'];
  if (no.some((n) => t === n || t.startsWith(n + ' ') || t.includes(' ' + n))) return false;
  if (yes.some((y) => t === y.trim() || t.startsWith(y))) return true;
  if (NEGATION.some((n) => t.startsWith(n))) return false;
  return null;
}


function resolveAsset(slots, assets, blocks) {
  if (slots.assetTag) {
    const direct = assets.find((a) => a.tag.toUpperCase() === slots.assetTag.toUpperCase());
    if (direct) return { asset: direct, candidates: [direct], method: 'explicit asset tag', confidence: 1.0 };
  }
  let pool = assets;
  if (slots.machineType) pool = pool.filter((a) => a.typeKey === slots.machineType);
  if (slots.blockName) {
    const block = blocks.find((b) => b.name.toLowerCase() === String(slots.blockName).toLowerCase());
    if (block) pool = pool.filter((a) => a.blockId === block.id);
  }
  if (slots.floor !== null && slots.floor !== undefined) pool = pool.filter((a) => a.floor === slots.floor);

  if (pool.length === 1) return { asset: pool[0], candidates: pool, method: 'type + block + floor', confidence: 0.92 };
  return { asset: null, candidates: pool, method: 'ambiguous', confidence: pool.length ? 0.4 : 0 };
}







const EARTH_KM = 6371;
function haversineKm(a, b) {
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * EARTH_KM * Math.asin(Math.sqrt(s));
}


const DemoMapsProvider = {
  name: 'DemoMaps',
  mode: 'DEMO',
  capabilities: ['distanceMatrix', 'routing', 'eta'],
  assumptions: { circuityFactor: 1.35, speedKmphTwoWheeler: 22, campusWalkKmph: 4.5, note: 'DEMO assumptions, not measured.' },

  async distanceMatrix({ origins, destinations, mode = 'two_wheeler' }) {
    const rows = origins.map((o) => ({
      origin: o,
      elements: destinations.map((d) => {
        const straight = haversineKm(o, d);
        const roadKm = +(straight * this.assumptions.circuityFactor).toFixed(2);
        const speed = mode === 'walk' ? this.assumptions.campusWalkKmph : this.assumptions.speedKmphTwoWheeler;
        const minutes = Math.max(2, Math.round((roadKm / speed) * 60));
        return { destination: d, distanceKm: roadKm, durationMinutes: minutes, straightLineKm: +straight.toFixed(2) };
      }),
    }));
    return { mode: 'DEMO', provider: this.name, rows, computedLocally: true };
  },

  async route({ origin, destination, mode = 'two_wheeler' }) {
    const m = await this.distanceMatrix({ origins: [origin], destinations: [destination], mode });
    const el = m.rows[0].elements[0];
    return {
      mode: 'DEMO', provider: this.name,
      distanceKm: el.distanceKm, durationMinutes: el.durationMinutes,
      polyline: null,
      steps: [`Head towards ${destination.label || 'destination'}`, `Approx ${el.distanceKm} km`],
      note: 'Straight-line geometry with a circuity factor. Not a real road route.',
    };
  },

  async geocode({ address }) {
    return { mode: 'DEMO', provider: this.name, results: [], note: 'Demo provider does not geocode free text. Campus assets carry stored coordinates.', address };
  },
};


function makeMapsService(liveProvider = null) {
  const demo = DemoMapsProvider;
  const pick = () => liveProvider || demo;

  async function guarded(fn, args, fallbackFn) {
    const p = pick();
    if (p === demo) return fallbackFn ? fallbackFn(args) : null;
    try {
      const res = await fn(p, args);
      return res;
    } catch (err) {
      const fb = await fallbackFn(args);
      return { ...fb, degraded: true, degradedReason: sanitizeError(err) };
    }
  }

  return {
    providerName: () => pick().name,
    providerMode: () => pick().mode,
    distanceMatrix: (a) => guarded((p, x) => p.distanceMatrix(x), a, (x) => demo.distanceMatrix(x)),
    route: (a) => guarded((p, x) => p.route(x), a, (x) => demo.route(x)),
    geocode: (a) => guarded((p, x) => p.geocode(x), a, (x) => demo.geocode(x)),

    
    async findNearest({ site, technicians, requiredSkill, localHour, mode = 'two_wheeler' }) {
      const eligible = technicians.filter((t) => {
        const skilled = t.skills.includes(requiredSkill) || t.skills.includes('ELECTRICAL');
        const onShift = localHour >= t.shiftStartHour && localHour < t.shiftEndHour;
        return skilled && onShift && t.status !== 'UNAVAILABLE';
      });
      const excluded = technicians
        .filter((t) => !eligible.includes(t))
        .map((t) => ({
          id: t.id, name: t.name,
          reason: !(t.skills.includes(requiredSkill) || t.skills.includes('ELECTRICAL'))
            ? `no ${requiredSkill} skill`
            : !(localHour >= t.shiftStartHour && localHour < t.shiftEndHour)
              ? `off shift (${t.shiftStartHour}:00–${t.shiftEndHour}:00)`
              : 'marked unavailable',
        }));

      if (eligible.length === 0) return { candidates: [], excluded, mode: this.providerMode(), provider: this.providerName() };

      const dm = await this.distanceMatrix({ origins: eligible.map((t) => ({ lat: t.lat, lng: t.lng, id: t.id })), destinations: [site], mode });
      const candidates = eligible.map((t, i) => {
        const el = dm.rows[i].elements[0];
        
        const travelScore = Math.max(0, 40 - el.durationMinutes * 1.6);
        const loadScore = Math.max(0, 25 - t.openJobs * 8);
        const skillScore = t.skills.includes(requiredSkill) ? 20 : 8;
        const reliabilityScore = (t.completionRate / 100) * 15;
        const total = +(travelScore + loadScore + skillScore + reliabilityScore).toFixed(1);
        return {
          technicianId: t.id, name: t.name, distanceKm: el.distanceKm, etaMinutes: el.durationMinutes,
          openJobs: t.openJobs, completionRate: t.completionRate,
          breakdown: [
            { k: 'Travel time', v: +travelScore.toFixed(1), detail: `${el.etaMinutes || el.durationMinutes} min, ${el.distanceKm} km` },
            { k: 'Current load', v: +loadScore.toFixed(1), detail: `${t.openJobs} open job(s)` },
            { k: 'Exact skill match', v: skillScore, detail: t.skills.includes(requiredSkill) ? requiredSkill : 'general electrical only' },
            { k: 'Completion record', v: +reliabilityScore.toFixed(1), detail: `${t.completionRate}%` },
          ],
          score: total,
        };
      }).sort((a, b) => b.score - a.score);

      return { candidates, excluded, mode: dm.mode, provider: dm.provider, degraded: !!dm.degraded };
    },
  };
}




const DemoPaymentsProvider = {
  name: 'DemoPayments',
  mode: 'DEMO',

  async challenge({ resource, amountPaise, currency = 'INR' }) {
    return {
      mode: 'DEMO', provider: this.name, status: 402,
      wwwAuthenticate: `P3P realm="nammafix", resource="${resource}", amount="${amountPaise}", currency="${currency}"`,
      note: 'Protocol-shaped challenge produced locally. No P3P Escrow endpoint was contacted.',
    };
  },

  async authorizeAndCapture({ resource, amountPaise, payeeHandle, mandateRef, agentId, idempotencyKey }) {
    
    
    const fail = String(idempotencyKey || '').includes('FORCE_FAIL');
    if (fail) {
      return {
        mode: 'DEMO', provider: this.name, ok: false, code: 'MANDATE_INSUFFICIENT',
        message: 'Reserved balance under the mandate is lower than the requested capture.',
        note: 'Deterministic demo failure path.',
      };
    }
    return {
      mode: 'DEMO', provider: this.name, ok: true,
      credentialShape: 'P3P-Credential: Payment <one-time, resource-scoped payload>',
      grantexShape: 'X-Grantex-Token: <delegated-authority assertion for the agent>',
      receipt: {
        receiptId: `DEMO-RCPT-${String(amountPaise)}-${Date.now().toString(36).toUpperCase()}`,
        amountPaise, currency: 'INR', payeeHandle, mandateRef: '[redacted]', agentId,
        capturedAt: new Date().toISOString(), verifiable: false,
        disclaimer: 'DEMO receipt. No funds moved. Not cryptographically verifiable.',
      },
    };
  },
};

function makePaymentsService(liveProvider = null) {
  const demo = DemoPaymentsProvider;
  return {
    providerName: () => (liveProvider ? liveProvider.name : demo.name),
    providerMode: () => (liveProvider ? liveProvider.mode : demo.mode),
    async pay(args) {
      const p = liveProvider || demo;
      try {
        const challenge = await p.challenge(args);
        const result = await p.authorizeAndCapture(args);
        return { ...result, challenge };
      } catch (err) {
        const fb = await demo.authorizeAndCapture(args);
        return { ...fb, degraded: true, degradedReason: sanitizeError(err) };
      }
    },
  };
}




function makeVoiceService({ liveProvider = null, browserSpeech = null } = {}) {
  return {
    providerName: () => (liveProvider ? liveProvider.name : browserSpeech ? 'BrowserSpeech' : 'Typed'),
    providerMode: () => (liveProvider ? liveProvider.mode : browserSpeech ? 'DEMO' : 'DEMO'),
    label: () => (liveProvider ? 'IBM Granite Speech Vachana' : browserSpeech ? 'Browser speech engine (not IBM Granite Speech)' : 'Typed input'),
    async transcribe(args) {
      if (liveProvider) {
        try { return await liveProvider.transcribe(args); }
        catch (err) { return { mode: 'DEMO', provider: 'Typed', transcript: null, degraded: true, degradedReason: sanitizeError(err), userMessage: 'Voice service is unavailable. You can continue by typing.' }; }
      }
      return { mode: 'DEMO', provider: 'Typed', transcript: args.transcript || null, note: 'No IBM Granite Speech credentials present. Transcript came from the browser engine or the keyboard.' };
    },
    async speak(args) {
      if (liveProvider) {
        try { return await liveProvider.speak(args); }
        catch (err) { return { mode: 'DEMO', provider: 'Typed', audio: null, degraded: true, degradedReason: sanitizeError(err) }; }
      }
      return { mode: 'DEMO', provider: browserSpeech ? 'BrowserSpeech' : 'Typed', audio: null, text: args.text };
    },
  };
}




function sanitizeError(err) {
  const msg = String((err && err.message) || err || 'unknown error');
  return msg
    .replace(/https?:\/\/[^\s)]+/g, '[url]')
    .replace(/(key|token|secret|authorization)[=:]\s*\S+/gi, '$1=[redacted]')
    .slice(0, 160);
}


function classifyFailure(status) {
  const map = {
    401: ['AUTH', 'The maintenance system could not authenticate with this service. An administrator has been notified.'],
    403: ['AUTH', 'This service refused the request. An administrator has been notified.'],
    404: ['NOT_FOUND', 'That resource was not found. Continuing without it.'],
    408: ['TIMEOUT', 'The service did not respond in time. Continuing with local estimates.'],
    429: ['RATE_LIMIT', 'The service is rate-limiting us. Retrying shortly; nothing is lost.'],
    500: ['UPSTREAM', 'The service reported an internal error. Continuing with local estimates.'],
    502: ['UPSTREAM', 'The service is unreachable. Continuing with local estimates.'],
    503: ['UPSTREAM', 'The service is temporarily unavailable. Continuing with local estimates.'],
  };
  return map[status] || ['UNKNOWN', 'Something went wrong with an external service. Your report is safe and the work continues.'];
}








const DAY = 86400000;
const _rupees = (paise) => `₹${(paise / 100).toLocaleString('en-IN')}`;

function buildTools({ store, maps, payments, voice }) {
  const S = store;
  const db = S.db;
  const now = () => S.clock.now();
  const localHour = () => new Date(now() + 5.5 * 3600000).getUTCHours(); 

  
  const T = {};
  const def = (name, spec) => { T[name] = { name, ...spec }; };

  

  def('parse_report', {
    purpose: 'Turn a raw utterance into structured slots without a model.',
    input: '{ text: string, context?: object }',
    output: '{ slots, evidence, confidence, missing }',
    permission: 'classify', failures: ['empty text'], audit: false,
    run: ({ text, context }) => {
      if (!text || !String(text).trim()) return { ok: false, error: 'EMPTY_REPORT', rationale: 'Nothing to parse.' };
      const r = extractSlots(text, context || {});
      return { ok: true, data: r, rationale: `Resolved ${4 - r.missing.length}/4 slots from the utterance using a rule-based extractor.` };
    },
  });

  def('identify_asset', {
    purpose: 'Bind a report to exactly one asset record, or report ambiguity.',
    input: '{ slots }', output: '{ assetId | candidates[] }',
    permission: 'read_asset', failures: ['ambiguous', 'no asset record'], audit: true,
    run: ({ slots, text = '' }) => {
      const oos = detectOutOfScope(text);
      if (oos.outOfScope && !slots.assetTag && !slots.machineType) {
        return { ok: false, error: 'OUT_OF_SCOPE', data: { department: oos.department, matched: oos.matched }, rationale: `"${oos.matched}" is not a registered shared machine. This belongs to ${oos.department}. The agent routes it rather than opening a work order it has no tool to complete.` };
      }
      const res = resolveAsset(slots, db.assets, db.blocks);
      if (!slots.assetTag && !slots.machineType && res.candidates.length > 3) {
        return { ok: false, error: 'NO_ASSET_RECORD', data: { slots }, rationale: 'No machine was named and nothing in the register matches. The agent is forbidden from creating asset records, so a human registers it.' };
      }
      if (res.asset) return { ok: true, data: { assetId: res.asset.id, tag: res.asset.tag, confidence: res.confidence, method: res.method }, rationale: `Matched ${res.asset.tag} by ${res.method} (confidence ${res.confidence}).` };
      if (res.candidates.length === 0) {
        return { ok: false, error: 'NO_ASSET_RECORD', data: { slots }, rationale: 'No asset in the registry matches. The agent is forbidden from creating asset records, so this goes to a human.' };
      }
      const q = nextQuestion(['blockName', 'floor'].filter((k) => !slots[k] && slots[k] !== 0)) || { text: 'Which of these is it?' };
      return { ok: false, error: 'AMBIGUOUS', data: { candidates: res.candidates.map((a) => ({ id: a.id, tag: a.tag, location: a.location })), question: q.text, slot: q.slot }, rationale: `${res.candidates.length} assets still match. Asking one question rather than a form.` };
    },
  });

  def('get_machine', {
    purpose: 'Read the asset record.', input: '{ assetId }', output: 'asset',
    permission: 'read_asset', failures: ['unknown asset'], audit: false,
    run: ({ assetId }) => {
      const a = S.asset(assetId);
      return a ? { ok: true, data: a, rationale: `Read ${a.tag}.` } : { ok: false, error: 'NOT_FOUND', rationale: 'Unknown asset id.' };
    },
  });

  def('get_machine_history', {
    purpose: 'Read failure and repair history — the agent\'s memory of this machine.',
    input: '{ assetId, windowDays? }', output: '{ events[], failuresInWindow, mtbfDays, totalDowntimeMinutes, totalCostPaise }',
    permission: 'read_history', failures: ['unknown asset'], audit: false,
    run: ({ assetId, windowDays = 90 }) => {
      const a = S.asset(assetId);
      if (!a) return { ok: false, error: 'NOT_FOUND', rationale: 'Unknown asset id.' };
      const all = S.historyFor(assetId);
      const cutoff = now() - windowDays * DAY;
      const failures = all.filter((h) => h.kind === 'FAILURE');
      const inWindow = failures.filter((h) => h.at >= cutoff);
      let mtbfDays = null;
      if (failures.length >= 2) {
        const gaps = [];
        for (let i = 0; i < failures.length - 1; i++) gaps.push((failures[i].at - failures[i + 1].at) / DAY);
        mtbfDays = +(gaps.reduce((s, g) => s + g, 0) / gaps.length).toFixed(1);
      }
      const data = {
        events: all, failuresInWindow: inWindow.length, mtbfDays,
        hoursSinceLastFailure: failures.length ? (now() - failures[0].at) / 3600000 : null,
        totalDowntimeMinutes: all.reduce((s, h) => s + (h.downtimeMinutes || 0), 0),
        totalCostPaise: all.reduce((s, h) => s + (h.costPaise || 0), 0),
        underWarranty: a.warrantyUntil > now(),
      };
      return { ok: true, data, rationale: `${inWindow.length} failure(s) in ${windowDays} days; lifetime spend ${_rupees(data.totalCostPaise)}; warranty ${data.underWarranty ? 'active' : 'expired'}.` };
    },
  });

  def('detect_recurring_failure', {
    purpose: 'Decide whether this asset has a pattern rather than an incident.',
    input: '{ assetId }', output: '{ recurring, reasons[], recommendation }',
    permission: 'detect_recurrence', failures: [], audit: true,
    run: ({ assetId }) => {
      const h = T.get_machine_history.run({ assetId });
      if (!h.ok) return h;
      const { failuresInWindow, mtbfDays, totalCostPaise, underWarranty } = h.data;
      const a = S.asset(assetId);
      const type = S.machineType(a.typeKey);
      const ageMonths = Math.round((now() - a.installedAt) / (30 * DAY));
      const reasons = [];
      if (failuresInWindow >= 3) reasons.push(`${failuresInWindow} failures in 90 days (threshold 3)`);
      if (mtbfDays !== null && mtbfDays < 45) reasons.push(`mean time between failures ${mtbfDays} days (floor 45)`);
      if (!underWarranty && totalCostPaise > 200000) reasons.push(`out of warranty with ${_rupees(totalCostPaise)} spent to date`);
      if (ageMonths > type.typicalLifeMonths) reasons.push(`${ageMonths} months old, past the ${type.typicalLifeMonths}-month typical life`);
      const recurring = reasons.length >= 2 || failuresInWindow >= 3;
      return {
        ok: true,
        data: {
          recurring, reasons, failuresInWindow, mtbfDays, ageMonths,
          recommendation: recurring
            ? (totalCostPaise > 400000 ? 'REPLACE' : 'PREVENTIVE_SCHEDULE')
            : 'NONE',
        },
        rationale: recurring
          ? `Pattern detected: ${reasons.join('; ')}.`
          : 'No recurrence pattern above threshold.',
      };
    },
  });

  

  def('classify_issue', {
    purpose: 'Assign fault category and run the hazard screen. Safety is deterministic.',
    input: '{ text, hazardAnswer, assetId }', output: '{ category, functionLost, safety }',
    permission: 'classify', failures: [], audit: true,
    run: ({ text, hazardAnswer, assetId }) => {
      const a = S.asset(assetId);
      const safety = safetyPolicy({ text, hazardAnswer, assetType: a && a.typeKey });
      const slots = extractSlots(text);
      const category = safety.hazard ? 'ELECTRICAL_HAZARD'
        : slots.slots.functionLost === 'PARTIAL' ? 'DEGRADED_OUTPUT'
          : slots.slots.functionLost === 'INTERMITTENT' ? 'INTERMITTENT_FAULT' : 'TOTAL_FAILURE';
      return { ok: true, data: { category, functionLost: slots.slots.functionLost, safety }, rationale: safety.hazard ? safety.rationale : `Classified as ${category}; hazard screen clear.` };
    },
  });

  def('calculate_priority', {
    purpose: 'Score priority deterministically and show the arithmetic.',
    input: '{ assetId, safety, functionLost, duplicateReports }', output: '{ priority, score, factors[] }',
    permission: 'prioritise', failures: [], audit: true,
    run: ({ assetId, safety, functionLost = 'FULL', duplicateReports = 1 }) => {
      const a = S.asset(assetId);
      const type = S.machineType(a.typeKey);
      const h = T.get_machine_history.run({ assetId }).data;
      const p = priorityPolicy({
        safety, essential: type.essential, servesResidents: a.servesResidents,
        failuresLast90Days: h.failuresInWindow, hoursSinceLastFailure: h.hoursSinceLastFailure,
        localHour: localHour(), duplicateReports, functionLost,
      });
      return { ok: true, data: p, rationale: p.rationale };
    },
  });

  def('check_duplicate', {
    purpose: 'Attach corroborating reports to one work order instead of spawning duplicates.',
    input: '{ assetId }', output: '{ duplicate, ticketId? }',
    permission: 'read_history', failures: [], audit: true,
    run: ({ assetId }) => {
      const r = duplicatePolicy({ assetId, openTickets: S.openTickets(), now: now() });

  def('initiate_payment', {
    purpose: 'Pay an empanelled vendor inside the delegated envelope, or stop and ask.',
    input: '{ ticketId, workOrderId, amountPaise, vendorId, partId }', output: '{ receipt | approvalRequired }',
    permission: 'initiate_payment', failures: ['outside envelope', 'vendor not empanelled', 'mandate insufficient', 'network'], audit: true,
    run: async ({ ticketId, workOrderId, amountPaise, vendorId, partId, forceFail = false, approvalId = null }) => {
      const t = S.ticket(ticketId);
      const vendor = db.vendors.find((v) => v.id === vendorId);
      const approval = approvalId ? db.approvals.find((a) => a.id === approvalId) : null;
      const decision = spendingPolicy({
        amountPaise, ticketSpentPaise: t.spentPaise, policy: db.spendPolicy,
        vendorEmpanelled: !!(vendor && vendor.empanelled), hazardTicket: t.hazard, approval,
      });

      if (decision.decision !== 'AUTONOMOUS') {
        return { ok: false, error: decision.decision, data: { decision, amountPaise, vendorId, partId }, rationale: decision.rationale + ' ' + decision.reasons.join(' ') };
      }

      const res = await payments.pay({
        resource: `workorder/${workOrderId}/part/${partId}`, amountPaise,
        payeeHandle: vendor.upiHandle, mandateRef: 'HOSTEL_MANDATE', agentId: 'nammafix-agent-01',
        idempotencyKey: `${workOrderId}:${partId}:${amountPaise}${forceFail ? ':FORCE_FAIL' : ''}`,
      });

      if (!res.ok) {
        S.audit({ actor: 'agent', actorRole: 'AGENT', action: 'initiate_payment', entity: 'payment', entityId: workOrderId, after: { amountPaise, code: res.code }, rationale: `Payment refused: ${res.code}.`, outcome: 'FAILED' });
        return { ok: false, error: res.code || 'PAYMENT_FAILED', data: res, rationale: `Payment did not complete (${res.code}). Falling back to a human approval so the repair is not blocked silently.` };
      }

      const pay = {
        id: S.id('PAY'), ticketId, workOrderId, amountPaise, vendorId, partId,
        status: 'CAPTURED', at: now(), mode: res.mode, provider: res.provider,
        protocol: { challenge: res.challenge && res.challenge.wwwAuthenticate, credential: res.credentialShape, grantex: res.grantexShape },
      };
      db.payments.push(pay);
      db.paymentReceipts.push({ id: S.id('RCPT'), paymentId: pay.id, ...res.receipt });
      t.spentPaise += amountPaise;
      db.spendPolicy.spentTodayPaise += amountPaise;
      S.ticketEvent(ticketId, 'PAYMENT_CAPTURED', `${_rupees(amountPaise)} paid to ${vendor.name}.`, { mode: res.mode });
      S.audit({ actor: 'agent', actorRole: 'AGENT', action: 'initiate_payment', entity: 'payment', entityId: pay.id, after: { amountPaise, vendorId, mode: res.mode }, rationale: decision.rationale });
      return { ok: true, data: { payment: pay, receipt: res.receipt, decision }, rationale: `${_rupees(amountPaise)} authorised and captured [${res.mode}] — inside the ${_rupees(db.spendPolicy.agentPerTransactionPaise)} per-transaction envelope.` };
    },
  });
